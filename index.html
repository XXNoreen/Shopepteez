    cqty:['componentqty','qtyperunit','qty','quantity'], description:['description','notes']}},
  purchases:{label:'Purchases', order:5, f:{
    date:['date','purchasedate'], name:['description','item','itemname','product'], qty:['quantity','qty'], unitCost:['unitcost','amount','costperunit','cost','price'],
    total:['total','totalcost','linetotal'], category:['category','type'], supplier:['supplier','vendor'], lot:['lotbatchno','lotno','batchno','lot','batch'],
    exp:['expirationdate','expirydate','expiration','expiry','exp'], payStatus:['paymentstatus','paid'], method:['paymentmethod','method'], notes:['notes','remarks']}},
  orders:{label:'Orders', order:7, f:{
    date:['date','orderdate'], orderNo:['orderno','ordernumber','orderid','order','no'], customer:['customer','customername','client','buyer'],
    product:['product','productname','description','item'], qty:['quantity','qty'], price:['sellingprice','amountsellingprice','unitprice','price','amount'],
    total:['total'], discount:['discount'], shipping:['shippingfee','shipping','shippingcharged'], method:['paymentmethod','method'],
    payStatus:['paymentstatus','paid'], status:['orderstatus','status'], notes:['remarks','notes']}},
  expenses:{label:'Expenses', order:6, f:{
    date:['date'], description:['description','expense','item','name'], category:['category'], amount:['amount','total','cost'],
    method:['paymentmethod','method'], vendor:['vendor','payee','supplier'], notes:['notes','remarks']}},
  customers:{label:'Customers', order:2, f:{
    name:['customername','customer','client','name'], type:['pricetype','type','customertype'], phone:['contactnumber','phone','mobile','contact','number'],
    email:['email'], address:['address'], notes:['notes']}},
  suppliers:{label:'Suppliers', order:1, f:{
    name:['suppliername','supplier','name'], person:['contactperson','person'], contact:['contactinfo','contact','phone','email'], notes:['notes']}},
};
const IMP_SHEETNAME = [[/supplier/,'suppliers'],[/customer|client/,'customers'],[/purchase/,'purchases'],[/expense/,'expenses'],[/order|sale/,'orders'],[/product|kit|recipe|costing/,'products'],[/inventor|suppl(y|ies)|stock/,'inventory']];
function impHeaderMap(kind, headers){
  const map={}, used=new Set(), H=headers.map(nh);
  for(const [key,syn] of Object.entries(IMP[kind].f)){
    for(const s of syn){ const i=H.findIndex((h,j)=>h===s && !used.has(j)); if(i>=0){ map[key]=i; used.add(i); break; } }
  }
  return map;
}
function impScore(kind, headers){ const m=impHeaderMap(kind,headers); return Object.keys(m).length + (m.name!==undefined||m.product!==undefined||m.description!==undefined?1:0); }
function impDetect(sheetName, headers){
  const n=sheetName.toLowerCase();
  for(const [re,k] of IMP_SHEETNAME) if(re.test(n)) return k;
  let best='skip', bs=1; for(const k in IMP){ const s=impScore(k,headers); if(s>bs){ bs=s; best=k; } } return best;
}
function impNum(v){ if(v===''||v==null) return null; if(typeof v==='number') return v; const s=String(v).replace(/[₱$,\s]/g,'').replace(/^\((.*)\)$/,'-$1'); const n=parseFloat(s); return isFinite(n)?n:null; }
function impDate(v){
  if(v===''||v==null) return '';
  if(v instanceof Date && !isNaN(v)){ const t=new Date(v.getTime()+12*3600e3); return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0'); }
  if(typeof v==='number' && v>20000 && v<80000){ const t=new Date(Math.round((v-25569)*864e5)); return isoD(new Date(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())); }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/);
  if(m){ let a=+m[1], b=+m[2], y=+m[3]; if(y<100) y+=2000; let mo=a, d=b; if(a>12){ d=a; mo=b; } if(mo<1||mo>12||d<1||d>31) return ''; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function impInferType(name, hint){
  const n=String(name).toLowerCase();
  if(/bac.?water|bacteriostatic|\bbac\d|pharmabac/.test(n)) return 'Bacwater';
  if(/syringe|needle/.test(n)) return 'Syringe';
  if(/box|bag|pouch|sticker|tape|bubble|foil|carton|mailer|label|wrap|cap\b|vial cap/.test(n)) return 'Packaging';

  if(/acetic|acid\b|saline|sterile water/.test(n)) return 'Other';
  if(hint==='supply') return 'Supplies';
  if(/\d+\s?mg|tirz|sema|reta|cagri|aod|ss-?31|bpc|tb-?500|ghk|mots|nad|peptide|amino|gtt/.test(n)) return 'Peptide';

}
const IMP_TYPES_LC = Object.fromEntries(ITEM_TYPES.map(t=>[t.toLowerCase(),t]));
const IMP_PTYPES = s => { const n=nh(s); if(/kit|set/.test(n)) return 'Set / Kit'; if(/water|bac/.test(n)) return 'Vial + Water'; if(/vial/.test(n)) return 'Vial Only'; if(/addon/.test(n)) return 'Add-on'; if(/supply/.test(n)) return 'Supply'; return PROD_TYPES.find(t=>nh(t)===n)||''; };
const IMP_PAY = s => { const n=nh(s); if(!n) return ''; if(/partial/.test(n)) return 'Partially Paid'; if(/refund/.test(n)) return 'Refunded'; if(/unpaid|notpaid|due|no$/.test(n)) return 'Unpaid'; if(/paid|yes|done/.test(n)) return 'Paid'; return ''; };
const IMP_STATUS = s => ORDER_STATUS.find(x=>nh(x)===nh(s)) || (nh(s)==='done'||nh(s)==='delivered'?'Completed':'');
const IMP_FEE = /^(admin|shipping|courier|delivery|service|handling|customs)?\s*fees?$|^shipping$|^admin fee|^shipping fee/i;
const IMP_SKIP = /delete this row/i;

let IM=null;
async function impReadFiles(files){
  await loadXLSX();
  const sheets=[];
  for(const file of files){
    const isCsv=/\.(csv|txt|tsv)$/i.test(file.name);
    let wb;
    if(isCsv){ const text=await file.text(); wb=XLSX.read(text,{type:'string', raw:true}); }
    else { const buf=await file.arrayBuffer(); wb=XLSX.read(buf,{type:'array', cellDates:true}); }
    for(const sn of wb.SheetNames){
      if(/read ?me|instruction|guide/i.test(sn)) continue;
      // Excel: read stored values (full decimals, real dates). CSV: keep the text exactly as written.
      const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1, raw:!isCsv, defval:'', blankrows:false});
      if(!aoa.length) continue;
      // header = first of the first 6 rows with >=2 recognised column names
      let hi=0, best=-1;
      for(let i=0;i<Math.min(6,aoa.length);i++){ const known=aoa[i].filter(h=>{ const n=nh(String(h)); return n && Object.values(IMP).some(k=>Object.values(k.f).some(s=>s.includes(n))); }).length; if(known>best){ best=known; hi=i; } }
      const headers=aoa[hi].map(h=>String(h).trim());
      const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c??'').trim()!=='') && !r.some(c=>IMP_SKIP.test(String(c??''))));
      const name=isCsv?file.name.replace(/\.[^.]+$/,''):sn;
      sheets.push({file:file.name, sheet:sn, name, headers, rows, kind:impDetect(isCsv?file.name:sn, headers)});
    }
  }
  return sheets;
}
function impRows(sh){
  const m=impHeaderMap(sh.kind, sh.headers);
  const keepRaw=new Set(['cost','qty','reorder','reorderQty','sell','price','reseller','extra','cqty','unitCost','total','discount','shipping','amount','date','exp']);
  return sh.rows.map((r,i)=>{ const o={_row:i+2}; for(const k in m){ const v=r[m[k]]; o[k]= keepRaw.has(k) && (typeof v==='number' || v instanceof Date) ? v : String(v??'').trim(); } return o; });
}

/* build a plan (no writes) */
function impPlan(sheets, opt){
  const P={suppliers:[],customers:[],items:[],itemUpd:[],products:[],productUpd:[],movements:[],purchases:[],expenses:[],orders:[],warn:[],skipDup:0,counts:{}};
  const key=s=>nh(s);
  const itemsBy=new Map(all('items').map(i=>[key(i.name),i])), prodBy=new Map(all('products').map(p=>[key(p.name),p]));
  const custBy=new Map(all('customers').map(c=>[key(c.name),c])), supBy=new Map(all('suppliers').map(s=>[key(s.name),s]));
  const T=today(), now=Date.now(); let seq=0; const created=()=>now+(seq++);
  const supId=name=>{ if(!name) return ''; const k=key(name); if(supBy.has(k)) return supBy.get(k).id; const s={id:uid('s_'),name:name.trim(),contactPerson:'',contact:'',notes:'',created:created()}; supBy.set(k,s); P.suppliers.push(s); return s.id; };
  const tidy=n=>{ n=String(n||'').trim(); return n.length>1 && n===n.toUpperCase() && /[A-Z]/.test(n) ? n.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()) : n; };
  const custId=(name,type)=>{ if(!name) return ''; name=tidy(name); const k=key(name); if(custBy.has(k)) return custBy.get(k).id; const c={id:uid('c_'),name:name.trim(),type:type||'Direct',phone:'',email:'',address:'',notes:'',created:created()}; custBy.set(k,c); P.customers.push(c); return c.id; };
  // codes like T15 / BAC3 / Cag5 match full names like “Tirz 15mg” / “Bacwater 3ml” / “Cagrilintide 5mg”
  const isCode=n=>/^[A-Za-z0-9.\-]{1,10}$/.test(String(n).trim()) && /\d/.test(n) && /[a-z]/i.test(n);
  const parts=n=>{ const L=String(n).replace(/[^a-z]/gi,'').toLowerCase(); const m=String(n).match(/(\d+(?:\.\d+)?)\s*(mg|ml|mcg|iu|g)\b/i)||String(n).match(/(\d+(?:\.\d+)?)/); return {L, num:m?m[1]:''}; };
  const codeFits=(code,full)=>{ if(!isCode(code)||isCode(full)||!/\s/.test(String(full).trim())) return false; const c=parts(code), f=parts(full); return c.L.length>0 && c.num && c.num===f.num && f.L.startsWith(c.L); };
  P.info=[];
  const findItem=(name,rename)=>{ const k=key(name); let it=itemsBy.get(k)||null;
    if(!it){ const seen=new Set(), hits=[]; for(const x of itemsBy.values()){ if(seen.has(x)) continue; seen.add(x); if(codeFits(x.name,name)||codeFits(name,x.name)||(x.sku&&key(x.sku)===k)) hits.push(x); } if(hits.length===1) it=hits[0]; }
    if(it && rename && key(it.name)!==k && P.items.includes(it) && isCode(it.name) && codeFits(it.name,name)){ P.info.push(`“${it.name}” was matched to “${name.trim()}” — saved with that name and SKU ${it.sku||it.name}.`); it.sku=it.sku||it.name; it.name=name.trim(); itemsBy.set(k,it); it.type=impInferType(it.name, it.type==='Supplies'?'supply':'inventory'); }
    return it; };
  const newItem=(name,hint,extra={})=>{ const t=impInferType(name,hint); const it={id:uid('i_'),name:name.trim(),sku:'',type:t,category:'',unit:t==='Peptide'||t==='Bacwater'?'vial':'pc',defaultCost:0,sellPrice:0,supplierId:'',reorderLevel:0,reorderQty:0,status:'active',notes:'',created:created(),...extra}; itemsBy.set(key(name),it); P.items.push(it); return it; };
  const byKind=k=>sheets.filter(s=>s.kind===k).flatMap(s=>impRows(s).map(r=>({...r,_sheet:s.name})));
  const at=(r)=>`${r._sheet} row ${r._row}`;

  for(const r of byKind('suppliers')){ if(!r.name) continue; const k=key(r.name); if(supBy.has(k)){ continue; } const s={id:uid('s_'),name:r.name,contactPerson:r.person||'',contact:r.contact||'',notes:r.notes||'',created:created()}; supBy.set(k,s); P.suppliers.push(s); }
  // customers (only commercial fields are read)
  for(const r of byKind('customers')){ if(!r.name) continue; const k=key(r.name); if(custBy.has(k)) continue; const c={id:uid('c_'),name:tidy(r.name),type:/resell/i.test(r.type)?'Reseller':'Direct',phone:r.phone||'',email:r.email||'',address:r.address||'',notes:r.notes||'',created:created()}; custBy.set(k,c); P.customers.push(c); }
  // inventory
  const invSheets=sheets.filter(s=>s.kind==='inventory');
  for(const sh of invSheets){ const hint=/suppl/i.test(sh.name)?'supply':'inventory';
    for(const r of impRows(sh)){ if(!r.name){ continue; }

      if(qty!=null){

    if(comps.length){ const merged={}; for(const c of comps) merged[c.itemId]=r4((merged[c.itemId]||0)+c.qty); d.components=Object.entries(merged).map(([itemId,qty])=>({itemId,qty})); }
    const ex=prodBy.get(key(name));
    if(ex){ for(const pk of Object.keys(d)) if(JSON.stringify(ex[pk]??'')===JSON.stringify(d[pk]??'')) delete d[pk]; if(Object.keys(d).length) P.productUpd.push({id:ex.id,name:ex.name,patch:d}); }
    else { const p={id:uid('p_'),name:name.trim(),sku:'',type:/set|kit/i.test(name)?'Set / Kit':/water|bac/i.test(name)?'Vial + Water':/vial/i.test(name)?'Vial Only':'Custom',description:'',price:0,resellerPrice:0,extraCost:0,components:[],status:'active',created:created(),...d}; prodBy.set(key(name),p); P.products.push(p); }
  }
  // purchases (+ fees and expense rows found in a combined Purchases/Expense sheet)
  const expCats=cfg().expenseCategories.map(c=>c.toLowerCase());
  const existingPL=new Set(); for(const p of all('purchases').filter(p=>!p.voided)) for(const l of p.lines) existingPL.add([p.date,key(get('items',l.itemId)?.name||l.name),r2(l.qty),r2(l.unitCost)].join('|'));
  const groups=new Map();
  for(const r of byKind('purchases')){
    if(!r.name) continue;
    const date=impDate(r.date)||T, qty=impNum(r.qty), total=impNum(r.total); let uc=impNum(r.unitCost);
    const cat=String(r.category||'').toLowerCase().trim();
    if(IMP_FEE.test(r.name.trim()) || cat==='fee' || cat==='fees'){ const amt=total!=null?total:(uc||0)*(qty||1); const g=impGroup(groups,date,r.supplier); g.fees+=amt; continue; }
    const isExpense = cat==='expense' || cat==='expenses' || (cat && !['inventory','supply','supplies','stock'].includes(cat) && expCats.includes(cat));
    if(isExpense){ P._expRows=(P._expRows||[]).concat({...r, date, amount:total!=null?total:(uc||0)*(qty||1)}); continue; }
    if(!(qty>0)){ P.warn.push(`Skipped ${at(r)}: “${r.name}” has no quantity.`); continue; }
    if(total!=null && total>0) uc=total/qty; if(uc==null) uc=0; uc=Math.round(uc*1e6)/1e6;   // the line total is what was actually paid
    const dupKey=[date,key(r.name),r2(qty),r2(uc)].join('|'); if(existingPL.has(dupKey)){ P.skipDup++; continue; } existingPL.add(dupKey);
    let it=findItem(r.name,true);
    if(!it && opt.addStock) it=newItem(r.name, cat.startsWith('suppl')?'supply':'inventory', {defaultCost:r4(uc)});
    if(it && !it.defaultCost && P.items.includes(it)) it.defaultCost=r4(uc);
    const g=impGroup(groups,date,r.supplier); g.lines.push({itemId:it?it.id:'', name:it?it.name:r.name.trim(), qty, unitCost:uc, lot:r.lot||'', exp:impDate(r.exp), note:r.notes||''}); if(r.payStatus) g.pay=IMP_PAY(r.payStatus)||g.pay; if(r.method) g.method=r.method;
  }
  let poN=0; const poBase=()=>{ let mx=1000; for(const o of all('purchases')){ const n=parseInt(String(o.no||'').replace(/\D/g,''),10); if(n>mx) mx=n; } return mx; }, pb=poBase();
  for(const g of [...groups.values()].sort((a,b)=>a.date.localeCompare(b.date))){
    if(!g.lines.length){ if(g.fees && all('purchases').some(p=>!p.voided && p.date===g.date && Math.abs(num(p.fees)-g.fees)<0.01)){ P.skipDup++; continue; } if(g.fees) P._expRows=(P._expRows||[]).concat({date:g.date,description:'Fees'+(g.supplier?' — '+g.supplier:''),category:'Admin',amount:g.fees,_row:'',_sheet:'Purchases'}); continue; }
    const supplierId=supId(g.supplier);
    const p={id:uid('pu_'),no:'PO-'+(pb+(++poN)),date:g.date,supplierId,supplierName:'',lines:g.lines,fees:r2(g.fees),allocFees:true,paymentStatus:g.pay||'Paid',paymentMethod:g.method||'Other',notes:'Imported from file',created:created(),by:S.uid||'local'};
    const tot=puTotal(p); p.paid=p.paymentStatus==='Paid'?tot:0;
    if(opt.addStock){ const sub=p.lines.reduce((s,l)=>s+l.qty*l.unitCost,0);
      const mv=mkMovement('purchase',p.date,p.lines.filter(l=>l.itemId).map(l=>({itemId:l.itemId,qty:l.qty,unitCost:r4(l.unitCost+(sub>0?p.fees*(l.qty*l.unitCost)/sub/l.qty:0)),lot:l.lot,exp:l.exp})),{ref:{col:'purchases',id:p.id},refNo:p.no,supplierId,created:created()});
      P.movements.push(mv); p.movementId=mv.id; }
    else { p.imported=true; p.notes='Imported as history (stock not added)'; }
    P.purchases.push(p);
  }
  // items with no cost: use what the purchase rows say they cost
  for(const mv of P.movements) if(mv.type==='opening') for(const l of mv.lines){ const it=P.items.find(x=>x.id===l.itemId); if(it && !(num(l.unitCost)>0) && it.defaultCost>0) l.unitCost=it.defaultCost; }
  // expenses
  const existingE=new Set(all('expenses').filter(e=>!e.voided).map(e=>[e.date,key(e.description),r2(num(e.amount))].join('|')));
  const catOf=c=>{ const f=cfg().expenseCategories.find(x=>x.toLowerCase()===String(c||'').toLowerCase()); return f||'Miscellaneous'; };
  for(const r of [...byKind('expenses'), ...(P._expRows||[])]){
    const desc=r.description||r.name; const amount=r.amount!=null&&typeof r.amount==='number'?r.amount:impNum(r.amount); if(!desc||!(amount>0)) continue;
    const date=impDate(r.date)||T, k=[date,key(desc),r2(amount)].join('|'); if(existingE.has(k)){ P.skipDup++; continue; } existingE.add(k);
    const category=catOf(r.category);
    P.expenses.push({id:uid('e_'),date,description:desc,category,amount:r2(amount),method:r.method||'Other',vendor:r.vendor||'',notes:[r.notes,(r.category&&category==='Miscellaneous'&&!/^misc/i.test(r.category))?'Category in file: '+r.category:''].filter(Boolean).join(' · '),created:created(),by:S.uid||'local'});
  }
  delete P._expRows;
  // orders
  const existingO=new Set(); for(const o of all('orders').filter(o=>!o.voided)) for(const l of o.items) existingO.add([o.date,key(custName(o)),key(l.name),r2(l.qty),r2(l.price)].join('|'));
  const oGroups=new Map(); let anon=0;
  for(const r of byKind('orders')){
    if(!r.product) continue;
    const date=impDate(r.date)||T, qty=impNum(r.qty)||1; let price=impNum(r.price); const total=impNum(r.total); if(price==null && total!=null) price=total/qty; if(price==null) price=0;
    let cust=r.customer; if(!cust && r.notes){ cust=r.notes.split(/[\s,\-–—:]+/)[0]; cust=cust? cust.charAt(0).toUpperCase()+cust.slice(1):''; }
    const dk=[date,key(cust||'Walk-in'),key(r.product),r2(qty),r2(price)].join('|'); if(existingO.has(dk)){ P.skipDup++; continue; } existingO.add(dk);
    let p=prodBy.get(key(r.product)) || prodBy.get(key(r.product.replace(/s$/i,'')));
    if(!p){ p={id:uid('p_'),name:r.product.trim(),sku:'',type:/set|kit/i.test(r.product)?'Set / Kit':'Custom',description:'',price:r2(price),resellerPrice:0,extraCost:0,components:[],status:'active',created:created()}; prodBy.set(key(r.product),p); P.products.push(p); P.warn.push(`Product “${r.product}” (${at(r)}) wasn’t found, so it was created without a recipe. Add its components so COGS is right.`); }
    const gk=r.orderNo? 'n|'+r.orderNo : 'r|'+(anon++);
    if(!oGroups.has(gk)) oGroups.set(gk,{date,cust,lines:[],discount:impNum(r.discount)||0,shipping:impNum(r.shipping)||0,method:r.method||'',pay:IMP_PAY(r.payStatus),status:IMP_STATUS(r.status),notes:r.notes||''});
    oGroups.get(gk).lines.push({p,qty,price:r2(price)});
  }
  let soN=0; const sb=(()=>{ let mx=1000; for(const o of all('orders')){ const n=parseInt(String(o.no||'').replace(/\D/g,''),10); if(n>mx) mx=n; } return mx; })();
  for(const g of [...oGroups.values()].sort((a,b)=>a.date.localeCompare(b.date))){
    const customerId=custId(g.cust);
    const o={id:uid('o_'),no:'SO-'+(sb+(++soN)),date:g.date,customerId,customerName:'',items:g.lines.map(l=>({productId:l.p.id,name:l.p.name,qty:l.qty,price:l.price,_p:l.p})),discount:g.discount,shipping:g.shipping,
      paymentMethod:g.method||'Other',paymentStatus:g.pay||'Paid',payments:[],status:g.status||'Completed',notes:g.notes,created:created(),by:S.uid||'local'};
    if(!opt.deduct || !CONFIRMED.has(o.status)) o.imported=true;
    P.orders.push(o);
  }
  P.counts={suppliers:P.suppliers.length,customers:P.customers.length,items:P.items.length,itemUpd:P.itemUpd.length,products:P.products.length,productUpd:P.productUpd.length,
    purchases:P.purchases.length,purchaseLines:P.purchases.reduce((s,p)=>s+p.lines.length,0),expenses:P.expenses.length,orders:P.orders.length,movements:P.movements.length};
  return P;
}
function impGroup(groups,date,supplier){ const k=date+'|'+nh(supplier||''); if(!groups.has(k)) groups.set(k,{date,supplier:(supplier||'').trim(),lines:[],fees:0,pay:'',method:''}); return groups.get(k); }

async function impApply(P, opt){
  for(const s of P.suppliers) await put('suppliers',s);
  for(const c of P.customers) await put('customers',c);
  for(const it of P.items) await put('items',it);
  for(const u of P.itemUpd) await put('items',{...get('items',u.id),...u.patch});
  for(const p of P.products) await put('products',p);
  for(const u of P.productUpd) await put('products',{...get('products',u.id),...u.patch});
  for(const mv of P.movements) await put('movements',mv);
  for(const p of P.purchases) await put('purchases',p);
  for(const e of P.expenses) await put('expenses',e);
  for(const o0 of P.orders){
    const o={...o0, items:o0.items.map(({_p,...l})=>({...l, unitCogs:productCost(get('products',l.productId)||_p)}))};
    const t=oTotal(o); if(o.paymentStatus==='Paid') o.payments=[{id:uid('pay_'),date:o.date,amount:t,method:o.paymentMethod}];
    if(!o.imported) await deductOrder(o,o.date);
    await put('orders',o);
  }
  const c=P.counts;
  await audit('import','settings','main',`Imported file: ${c.items} new items, ${c.itemUpd} updated, ${c.products} products, ${c.purchases} purchases, ${c.orders} orders, ${c.expenses} expenses, ${c.customers} customers${P.skipDup?`, ${P.skipDup} duplicates skipped`:''}`);
}

  editPurchase:d=>purchaseModal(null,d.id),
  wPickCust:d=>{ W.customerId=d.id; W.walkin=!d.id; W.newCust=null; if(d.id) W.keepName=''; W._same=true; wizRender(); },
  wCustom:()=>{ const it=all('items').filter(i=>i.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name))[0]; W.cb={name:'',price:'',comps:it?[{itemId:it.id,qty:1}]:[],save:false,idx:null}; W._same=true; wizRender(); },
  wSingle:()=>{ const it=all('items').filter(i=>i.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name))[0]; if(!it){ toast('Add inventory items first.'); return; } W.cb={single:true,autoName:true,name:it.name,price:num(it.sellPrice)||'',comps:[{itemId:it.id,qty:1}],idx:null}; W._same=true; wizRender(); },
  wCbAdd:()=>{ const used=new Set(W.cb.comps.map(c=>c.itemId)); const it=all('items').filter(i=>i.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name)).find(i=>!used.has(i.id)); if(!it){ toast('No more items to add.'); return; } W.cb.comps.push({itemId:it.id,qty:1}); W._same=true; wizRender(); },
  wCbDel:d=>{ W.cb.comps.splice(+d.i,1); W._same=true; wizRender(); },
  wCbCancel:()=>{ W.cb=null; W._same=true; wizRender(); },
  wCbSave:()=>{ const b=W.cb; const name=String(b.name||'').trim(); if(!name){ toast('Give it a name, e.g. “T15 + extra syringes”.'); return; }
    const comps=b.comps.filter(c=>get('items',c.itemId)&&num(c.qty)>0).map(c=>({itemId:c.itemId,qty:num(c.qty)}));
    if(!comps.length && !confirm('This has no inventory linked, so nothing will be deducted from stock. Add it anyway?')) return;
    const line={custom:true, name, price:num(b.price), components:comps, extraCost:0, save:!!b.save};
    if(b.idx!=null){ const old=W.cart[b.idx]; W.cart[b.idx]={...line, qty:old.qty}; } else W.cart.push({...line, qty:1});
    W.cb=null; W._same=true; wizRender(); },
  wEditLine:d=>{ const l=W.cart[+d.i]; W.cb={single:false,name:l.name,price:l.price,comps:(l.components||[]).map(c=>({...c})),save:!!l.save,idx:+d.i}; W._same=true; wizRender(); },
});
boot();
</script>
<script>
/* PWA: offline support, persistent storage, home-screen shortcuts */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js?v=3',{updateViaCache:'none'}).then(r=>{ r.update().catch(()=>{}); }).catch(()=>{}));
  // When a new version takes over, refresh once to show it. Your records are not touched: they stay saved on this device.
  let hadController=!!navigator.serviceWorker.controller, reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!hadController){ hadController=true; return; }
    if(reloading) return;
    const go=()=>{ reloading=true; try{ sessionStorage.setItem('shopepteez-updated','1'); }catch(e){} location.reload(); };
    if(document.querySelector('#scrim.open')){ const t=setInterval(()=>{ if(!document.querySelector('#scrim.open')){ clearInterval(t); go(); } },1000); } else go();
  });
  try{ if(sessionStorage.getItem('shopepteez-updated')){ sessionStorage.removeItem('shopepteez-updated'); setTimeout(()=>toast('Shopepteez updated · your records are unchanged'),900); } }catch(e){}
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
(function(){ const p=new URLSearchParams(location.search); const v=p.get('view'), a=p.get('action');
  const run=()=>{ if(!S.ready){ return setTimeout(run,150); } if(v && typeof go==='function') go(v); if(a==='newSale') newSale(); };
  if(v||a) run(); })();
</script>
