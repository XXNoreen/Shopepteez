<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopepteez — business manager</title>
<meta name="theme-color" content="#E5468A">
<link rel="manifest" href="shopepteez.webmanifest?v=3">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" href="shopepteez-icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="shopepteez-apple.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shopepteez">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Shopepteez">
<meta name="msapplication-TileColor" content="#E5468A">
<meta name="description" content="Inventory, kits, orders, expenses and profit for your peptide shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8FB; --top:#FFE9F2; --surface:#FFFFFF; --surface2:#FFF1F6; --ink:#2A1822; --muted:#8E7482; --line:#F3DDE7;
  --pink:#E5468A; --pink-600:#C9307A; --pink-400:#FF86B6; --pink-200:#FFC6DC; --pink-100:#FFE3EE; --pink-50:#FFF4F8;
  --grad:linear-gradient(135deg,#FF93C1 0%,#F05A99 52%,#D63680 100%);
  --nav:#2A1822; --nav-ink:#F7E9F0; --nav-muted:#BFA3B1; --chip:#F4E9EE;
  --ok:#1C8E57; --ok-bg:#E1F5EA; --info:#3B63C9; --info-bg:#E8EEFC; --bad:#D63A33; --bad-bg:#FDE7E5;
  --opt:#C46F08; --opt-bg:#FFF0DA; --warn:#8F5306; --warn-bg:#FFF3D8; --rest:#8E7A86; --rest-bg:#F3ECF0; --vio:#6B4FC7; --vio-bg:#EEE9FF;
  --focus:#C9307A; --shadow:0 8px 24px rgba(201,48,122,.08); --side:236px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#170D13; --top:#24121C; --surface:#21151E; --surface2:#2B1B26; --ink:#FBEFF5; --muted:#C2A6B5; --line:#3A2432;
  --pink:#FF6FA9; --pink-600:#FF8DBD; --pink-400:#FF9CC5; --pink-200:#5A2640; --pink-100:#3B1D2D; --pink-50:#28151F;
  --grad:linear-gradient(135deg,#FF7FB4 0%,#E84A8C 55%,#BC2A6B 100%);
  --nav:#0F080C; --chip:#33222C;
  --ok:#52D695; --ok-bg:#133226; --info:#8AB0FF; --info-bg:#1A2745; --bad:#FF8A82; --bad-bg:#3D1A19;
  --opt:#F7B062; --opt-bg:#3B2811; --warn:#F2C063; --warn-bg:#352A10; --rest:#A8939F; --rest-bg:#2E2229; --vio:#B4A2FF; --vio-bg:#2A2342; --focus:#FF8DBD; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#170D13; --top:#24121C; --surface:#21151E; --surface2:#2B1B26; --ink:#FBEFF5; --muted:#C2A6B5; --line:#3A2432;
  --pink:#FF6FA9; --pink-600:#FF8DBD; --pink-400:#FF9CC5; --pink-200:#5A2640; --pink-100:#3B1D2D; --pink-50:#28151F;
  --grad:linear-gradient(135deg,#FF7FB4 0%,#E84A8C 55%,#BC2A6B 100%);
  --nav:#0F080C; --chip:#33222C;
  --ok:#52D695; --ok-bg:#133226; --info:#8AB0FF; --info-bg:#1A2745; --bad:#FF8A82; --bad-bg:#3D1A19;
  --opt:#F7B062; --opt-bg:#3B2811; --warn:#F2C063; --warn-bg:#352A10; --rest:#A8939F; --rest-bg:#2E2229; --vio:#B4A2FF; --vio-bg:#2A2342; --focus:#FF8DBD; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:15px/1.5 Outfit,"Avenir Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,var(--top) 0,var(--bg) 320px) no-repeat,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.click,label{touch-action:manipulation}
@media (max-width:760px){ input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea,.search input{font-size:16px} }
@media (display-mode: standalone){ body{overscroll-behavior-y:none} }
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600}
p{margin:0}
a{color:var(--pink-600)}
/* shell */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--nav);color:var(--nav-ink);padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px;display:flex;flex-direction:column;gap:2px;z-index:30;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 18px}
.brand .lg{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.brand .lg svg{width:18px;height:18px}
.brand b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.brand span{font-size:12px;color:var(--nav-muted)}
.side .nv{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--nav-ink);opacity:.78;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14.5px;text-align:left;width:100%}
.side .nv svg{width:19px;height:19px;flex:none}
.side .nv:hover{opacity:1;background:rgba(255,255,255,.06)}
.side .nv[aria-current="page"]{background:var(--pink);color:#fff;opacity:1}
.side .nv .cnt{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
.side .grp{font-size:12px;color:var(--nav-muted);padding:16px 12px 6px}
.side .me{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:13px}
.side .me b{display:block;font-weight:600}
.side .me span{color:var(--nav-muted)}
.wrap{margin-left:var(--side);min-height:100vh}
main{max-width:1240px;margin:0 auto;padding:22px 28px 60px}
.mtop{display:none}
.dock{display:none}
@media (max-width:900px){
  .side{display:none}
  .wrap{margin-left:0}
  main{padding:14px 16px 120px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 0}
  .mtop .brand{padding:0}
  .mtop .brand span{color:var(--muted)}
  .dock{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--nav);border-radius:999px;padding:6px;gap:2px;z-index:40;box-shadow:0 16px 40px rgba(42,24,34,.35);max-width:calc(100% - 20px)}
  .dock button{border:0;background:none;color:#fff;opacity:.72;height:48px;min-width:48px;padding:0 12px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13.5px}
  .dock button svg{width:21px;height:21px;flex:none}
  .dock button span{display:none}
  .dock button[aria-current="page"]{background:var(--pink-100);color:var(--pink-600);opacity:1;padding:0 15px}
  .dock button[aria-current="page"] span{display:inline;white-space:nowrap}
}
/* page header */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.ph h1{font-size:28px;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:4px;font-size:14px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 12px}
.sec h2{font-size:18px}
.sec .lnk,.lnk{border:0;background:none;color:var(--pink-600);font-weight:600;font-size:14px;padding:4px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--chip);padding:10px 16px;border-radius:999px;font-weight:500;line-height:1.2;white-space:nowrap;color:var(--ink);font-size:14.5px}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(214,54,128,.22)}
.btn.dark{background:var(--nav);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{color:var(--bad);background:var(--bad-bg)}
.btn.ghost{background:var(--surface);box-shadow:0 2px 10px rgba(201,48,122,.06)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.icon-btn{border:0;background:none;padding:8px;border-radius:50%;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;padding:0;box-shadow:0 4px 14px rgba(201,48,122,.08);flex:none}
.round svg{width:19px;height:19px}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.qa button{border:0;border-radius:18px;background:var(--surface);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:500;font-size:13px;color:var(--ink);box-shadow:var(--shadow);text-align:center;line-height:1.25}
.qa button .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--pink-100);color:var(--pink-600)}
.qa button .qi svg{width:19px;height:19px}
.qa button.main .qi{background:var(--grad);color:#fff}
@media (max-width:1100px){ .qa{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:520px){ .qa{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .qa button{padding:11px 4px;font-size:11.5px;border-radius:16px} .qa button .qi{width:34px;height:34px} }
/* cards */
.card{background:var(--surface);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:16.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi b{font-size:19px} }
.kpi{background:var(--surface);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow);border:0;text-align:left;color:var(--ink);width:100%}
button.kpi{cursor:pointer}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:600;line-height:1.25;margin-top:2px;letter-spacing:-.01em}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--grad);color:#fff}
.kpi.hl span,.kpi.hl small{color:rgba(255,255,255,.88)}
.grid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1050px){ .grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} }
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){ .grid3{grid-template-columns:1fr} }
/* waterfall */
.flow{display:flex;flex-direction:column;gap:6px}
.flow .st{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:14px;background:var(--surface2)}
.flow .st span{font-size:14px}
.flow .st span small{display:block;font-size:12px;color:var(--muted)}
.flow .st b{font-weight:600;font-size:16px;white-space:nowrap}
.flow .st.sub b{color:var(--muted);font-weight:500}
.flow .st.tot{background:var(--pink-100)}
.flow .st.net{background:var(--grad);color:#fff}
.flow .st.net small{color:rgba(255,255,255,.85)}
.flow .ar{text-align:center;color:var(--muted);font-size:12px;line-height:1}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:500;font-size:13.5px;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--nav);color:#fff}
.chips button .n{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:10px;background:var(--pink);color:#fff;font-size:11px;margin-left:6px;padding:0 5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--ink);line-height:1.5}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-info{background:var(--info-bg);color:var(--info)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-opt{background:var(--opt-bg);color:var(--opt)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-rest{background:var(--rest-bg);color:var(--rest)}
.c-pink{background:var(--pink-100);color:var(--pink-600)} .c-vio{background:var(--vio-bg);color:var(--vio)}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px} .r{text-align:right} .b{font-weight:600}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wr{flex-wrap:wrap}
.pos{color:var(--ok)} .neg{color:var(--bad)}
/* toolbar */
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tb .search{flex:1;min-width:200px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;height:44px;box-shadow:0 2px 10px rgba(201,48,122,.05)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;font-size:15px;min-width:0;padding:0}
/* tables */
.tbl-wrap{overflow-x:auto;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:11px 12px;background:var(--surface2);white-space:nowrap;position:sticky;top:0}
table.t td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.t .num{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--pink-50)}
table.t tr.void td{color:var(--muted);text-decoration:line-through}
table.t tr.void td .chip{text-decoration:none}
table.t tfoot td{font-weight:600;background:var(--surface2)}
table.t td.wrapc{white-space:normal;min-width:180px}
table.t .nm{font-weight:600}
table.t .sub{font-size:12px;color:var(--muted);white-space:normal}
.tbl-wrap.flat{box-shadow:none;border:1px solid var(--line)}
/* lists */
.att{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;margin-bottom:8px;border:0;width:100%;text-align:left;color:var(--ink);cursor:pointer}
.att .ai{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface)}
.att .ai svg{width:15px;height:15px}
.att b{display:block;font-weight:600;font-size:14px}
.att span{font-size:13px;color:var(--muted)}
.att.bad{background:var(--bad-bg)} .att.bad .ai{color:var(--bad)}
.att.warn{background:var(--warn-bg)} .att.warn .ai{color:var(--warn)}
.att.info{background:var(--info-bg)} .att.info .ai{color:var(--info)}
.att.pink{background:var(--pink-100)} .att.pink .ai{color:var(--pink-600)}
.health{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.health button{border:0;border-radius:16px;padding:12px;text-align:left;color:var(--ink)}
.health b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.health span{font-size:12.5px}
.hb-bad{background:var(--bad-bg)} .hb-bad b{color:var(--bad)}
.hb-warn{background:var(--opt-bg)} .hb-warn b{color:var(--opt)}
.hb-ok{background:var(--ok-bg)} .hb-ok b{color:var(--ok)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.hlp{padding:12px 16px;border-radius:16px;background:var(--pink-50);font-size:13.5px;color:var(--muted);border-left:4px solid var(--pink);margin-bottom:14px}
.banner{padding:12px 16px;border-radius:16px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin-bottom:14px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner b{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mini div{padding:11px 13px;border-radius:16px;background:var(--surface2)}
.mini span{display:block;font-size:12px;color:var(--muted)}
.mini b{font-size:16px;font-weight:600}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(42,24,34,.45);display:none;z-index:50;padding:24px}
.scrim.open{display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border-radius:28px;width:min(820px,100%);max-height:calc(100vh - 48px);overflow:auto;box-shadow:0 30px 80px rgba(42,24,34,.35);overscroll-behavior:contain}
.modal.narrow{width:min(520px,100%)}
.modal.wide{width:min(1000px,100%)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.m-head h2{font-size:20px}
.m-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.m-head .icon-btn{background:var(--surface);width:38px;height:38px;flex:none}
.m-body{padding:6px 22px 22px}
.m-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px 16px;position:sticky;bottom:0;background:var(--bg);flex-wrap:wrap;z-index:3;box-shadow:0 -8px 20px var(--bg)}
.m-foot .rt{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
/* forms */
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font-weight:600;font-size:15.5px;margin-bottom:10px;padding:0}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.fg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
label.f em{font-style:normal;color:var(--bad)}
label.cb{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:500}
input[type=checkbox]{accent-color:var(--pink);width:18px;height:18px;flex:none;margin:1px 0 0}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{width:100%;padding:11px 13px;border-radius:14px;border:1.5px solid transparent;background:var(--surface);color:var(--ink);font-size:15px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink-400)}
input[readonly]{background:var(--surface2);color:var(--muted)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.seg{display:inline-flex;border-radius:999px;background:var(--chip);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;font-weight:500;color:var(--muted);border-radius:999px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--nav);color:#fff}
.lines .ln{display:grid;gap:8px;align-items:end;padding:10px;border-radius:16px;background:var(--pink-50);margin-bottom:8px}
.lines .ln label.f{font-size:11.5px}
.ln-comp{grid-template-columns:minmax(0,2.4fr) 90px 110px 110px auto}
.ln-pur{grid-template-columns:minmax(0,2.2fr) 80px 110px 110px auto}
.ln-pur .x2{grid-column:span 2}
.ln-pur .newi{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr;gap:8px}
@media (max-width:700px){
  .ln-comp{grid-template-columns:1fr 1fr auto} .ln-comp .sel{grid-column:1/-1}
  .ln-pur{grid-template-columns:1fr 1fr auto} .ln-pur .sel{grid-column:1/-1} .ln-pur .x2{grid-column:span 1}
  .ln-pur .newi{grid-template-columns:1fr 1fr} .ln-pur .newi label:first-child{grid-column:1/-1}
}
.preview{padding:14px 16px;border-radius:18px;background:var(--pink-100);font-size:14px}
.warnbox{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.warnbox.bad{background:var(--bad-bg);color:var(--bad)}
.warnbox b{font-weight:600}
/* wizard */
.steps{display:flex;gap:6px;margin:0 0 6px}
.steps span{flex:1;height:6px;border-radius:9px;background:var(--pink-100)}
.steps span.on{background:var(--grad)}
.step-t{font-size:12.5px;font-weight:500;color:var(--pink-600);margin-bottom:12px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pick button{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:13px 14px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 10px rgba(201,48,122,.05)}
.pick button[aria-pressed="true"]{border-color:var(--pink)}
.pick button b{font-weight:600}
.pick button span{font-size:12.5px;color:var(--muted)}
.cart input[type=number]{background:var(--surface2)}
.cart .ci{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);margin-bottom:8px}
.qty{display:inline-flex;align-items:center;background:var(--surface2);border-radius:999px}
.qty button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:600;color:var(--ink)}
.qty input{width:52px;text-align:center;padding:6px 2px;border-radius:10px;background:transparent}
.check{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:13.5px}
.check li{display:flex;gap:8px;align-items:center}
.check li svg{width:16px;height:16px;color:var(--ok);flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--nav);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;z-index:80;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .2s;max-width:calc(100% - 32px)}
.sheet-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-nav button{border:0;background:var(--surface);border-radius:18px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13.5px}
.sheet-nav button svg{width:22px;height:22px;color:var(--pink-600)}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.lock svg{width:14px;height:14px}
@media (max-width:760px){ .scrim{padding:0;align-items:flex-end!important} .modal,.modal.narrow,.modal.wide{border-radius:26px 26px 0 0;max-height:94vh;width:100%} .m-head,.m-body,.m-foot{padding-left:16px;padding-right:16px} .pick{grid-template-columns:repeat(2,minmax(0,1fr))} .pick button{padding:10px 12px} .cart .ci{grid-template-columns:minmax(0,1fr) auto;} .cart .ci .icon-btn{grid-column:2;grid-row:1;justify-self:end} .cart .ci .qty{grid-column:1/-1;justify-self:start} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
@media print{ .side,.dock,.mtop,.acts,.tb,.chips{display:none!important} .wrap{margin:0} }
</style>

<body>
<aside class="side" id="side" aria-label="Sections"></aside>
<div class="wrap">
  <div class="mtop" id="mtop"></div>
  <main id="main"><div class="empty"><h3>Loading your business…</h3></div></main>
</div>
<nav class="dock" id="dock" aria-label="Sections"></nav>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileIn" hidden>
<script>
/* =========================================================
   Shopepteez — core
   Purchases → Inventory ledger → Products/Kits → Sales → COGS → Profit
   ========================================================= */
const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
  bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  kit:'<path d="M4 8h16v12H4z"/><path d="M9 8V5h6v3M4 13h16"/>',
  box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  truck:'<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.7.8 2.8 2.5 3 5.2"/>',
  factory:'<path d="M3 21V10l6 3V10l6 3V6l6 3v12z"/><path d="M7 17h2M12 17h2M17 17h1"/>',
  chart:'<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  check:'<path d="M5 12l4.5 4.5L19 7"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  vial:'<path d="M9 3h6M10 3v4l-4 11a2 2 0 0 0 2 3h8a2 2 0 0 0 2-3l-4-11V3"/><path d="M7.5 14h9"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  ledger:'<path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  clip:'<path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 12l2 2 4-4"/>',
};
const ic = (n, sw=1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = (p='') => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
const r4 = n => Math.round(n*10000)/10000;
const isoD = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => isoD(new Date());
const parseD = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const addDays = (s,n) => isoD(new Date(parseD(s).getTime()+n*864e5));
const daysTo = s => Math.round((parseD(s)-parseD(today()))/864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd = s => { if(!s) return '—'; const d=parseD(s); return MON[d.getMonth()]+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():''); };
const fdt = t => { const d=new Date(t); return fd(isoD(d))+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); };
const qf = q => { q=num(q); return Math.abs(q-Math.round(q))<1e-9 ? Math.round(q).toLocaleString('en-US') : (Math.round(q*100)/100).toLocaleString('en-US'); };
const pct = x => x===null||!isFinite(x) ? '—' : (Math.round(x*1000)/10)+'%';
function money(n, dec){
  const c = cfg().currency || '₱'; n=num(n);
  const neg = n < -0.004; n = Math.abs(n);
  const d = dec ?? (Math.abs(n - Math.round(n)) > 0.004 ? 2 : 0);
  return (neg?'−':'') + c + n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
const hueOf = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h; };
function toast(msg){ $$('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0'; setTimeout(()=>t.remove(),250)},2600); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- constants ---------- */
const ITEM_TYPES=['Peptide','Bacwater','Packaging','Syringe','Supplies','Other'];
const PROD_TYPES=['Set / Kit','Vial Only','Vial + Water','Add-on','Supply','Custom'];
const PAY_STATUS=['Paid','Partially Paid','Unpaid','Refunded'];
const ORDER_STATUS=['Pending','Processing','Packed','Shipped','Completed','Cancelled','Returned'];
const CONFIRMED=new Set(['Processing','Packed','Shipped','Completed']);
const ADJ_REASONS=['Damaged','Expired','Lost','Used internally','Freebie','Sample','Incorrect count','Returned to supplier','Manual correction','Other'];
const DEFAULTS = {
  business:{name:'',owner:'',phone:'',email:'',address:'',tin:''},
  currency:'₱',
  itemCategories:['Peptides','Bacteriostatic water','Packaging','Syringes & needles','Cleaning & swabs','Other supplies'],
  expenseCategories:['Inventory purchases','Packaging','Shipping','Admin','Marketing','Advertising','Software','Bank/payment fees','Salaries','Supplies','Equipment','Miscellaneous'],
  paymentMethods:['Cash','GCash','Bank Transfer','Other'],
  units:['vial','pc','box','roll','pack','bottle','set'],
  staffCanAdjust:false, staffCanPay:true, expiryWarnDays:90,
};

/* ---------- store ----------
   Collections (one document per record, shared by everyone the app is shared with):
   items, products, movements, orders, purchases, expenses, customers, suppliers, people, audit, settings
*/
const COLS=['items','products','movements','orders','purchases','expenses','customers','suppliers','people','audit','settings'];
const D=Object.fromEntries(COLS.map(c=>[c,new Map()]));
const S={mode:'local', db:null, user:null, uid:null, role:'admin', ready:false, ver:0, assets:null, loaded:new Set()};
const LSK='shopdesk:v2:';
const all = c => [...D[c].values()];
const get = (c,id) => D[c].get(id);
const cfg = () => Object.assign({}, DEFAULTS, get('settings','main')||{});
const isAdmin = () => S.role==='admin';
function lsLoad(){ for(const c of COLS){ try{ const a=JSON.parse(localStorage.getItem(LSK+c)||'null'); if(Array.isArray(a)) D[c]=new Map(a.map(x=>[x.id,x])); }catch(e){} } }
function lsSave(c){ try{ localStorage.setItem(LSK+c, JSON.stringify(all(c))); }catch(e){} }
async function put(c, obj){
  obj = clone(obj); obj.updatedAt = Date.now();
  D[c].set(obj.id, obj); S.ver++; lsSave(c);
  if(S.db){
    try{ await S.db.collection(c).doc(obj.id).set(obj); }
    catch(e){ console.warn('write failed',c,e); toast(e?.code==='quota_exceeded'?'Storage is full. Export a backup in Settings.':e?.code==='invalid_argument'?'You don’t have permission to change this.':'Couldn’t save. Check your connection.'); throw e; }
  }
  return obj;
}
async function putMany(list){ for(const [c,o] of list) await put(c,o); }

/* ---------- audit trail ---------- */
async function audit(action, col, id, summary){
  const m=today().slice(0,7), doc=clone(get('audit',m)||{id:m,entries:[]});
  doc.entries.push({t:Date.now(), u:S.uid||'local', role:S.role, action, col, ref:id, summary});
  if(doc.entries.length>3000) doc.entries=doc.entries.slice(-3000);
  try{ await put('audit',doc); }catch(e){}
}
const personName = id => { if(!id||id==='local') return 'You'; const p=get('people',id); return (p&&p.name) || (id===S.uid?'You':'User '+String(id).slice(-4)); };

/* ---------- ledger replay (single source of truth for quantity & cost) ---------- */
let DV=null, DVver=-1;
function dv(){ if(DVver===S.ver && DV) return DV; DV=derive(); DVver=S.ver; return DV; }
function mvSort(a,b){ return a.date.localeCompare(b.date) || (a.created||0)-(b.created||0); }
function derive(){
  const st={};
  for(const it of all('items')) st[it.id]={qty:0, avg:num(it.defaultCost), lots:[], deficit:0, txns:[], lastIn:null, inQty:0, outQty:0};
  const mvs=all('movements').sort(mvSort);
  for(const mv of mvs){
    for(const ln of mv.lines||[]){
      const s=st[ln.itemId]; if(!s) continue;
      const q=num(ln.qty);
      if(mv.type==='cost'){ s.avg=num(ln.unitCost); s.txns.push({mv, ln, in:0, out:0, bal:s.qty, avg:s.avg}); continue; }
      if(q>0){
        const u = ln.unitCost!=null && ln.unitCost!=='' ? num(ln.unitCost) : s.avg;
        const base=Math.max(s.qty,0);
        s.avg = (base<=0 || s.avg<=0) ? u : (base*s.avg + q*u)/(base+q);
        let add=q; if(s.deficit>0){ const t=Math.min(s.deficit,add); s.deficit-=t; add-=t; }
        const same = add>1e-9 && s.lots.find(l=>l.lot===(ln.lot||'') && l.exp===(ln.exp||'') && l.supplierId===(mv.supplierId||''));
        if(same && (mv.type==='void'||mv.type==='return'||mv.type==='cancel'||mv.type==='adjustment')) { same.qty+=add; add=0; }
        if(add>1e-9) s.lots.push({lot:ln.lot||'', exp:ln.exp||'', qty:add, date:mv.date, supplierId:mv.supplierId||'', mvId:mv.id, ref:mv.ref, unitCost:u});
        if(mv.type==='purchase'||mv.type==='opening') s.lastIn={date:mv.date, mvId:mv.id, qty:q, unitCost:u, supplierId:mv.supplierId||''};
        s.inQty+=q;
      } else if(q<0){
        let need=-q;
        s.lots.sort((a,b)=>(a.exp||'9999-99').localeCompare(b.exp||'9999-99') || a.date.localeCompare(b.date));
        for(const lot of s.lots){ if(need<=1e-9) break; const t=Math.min(lot.qty,need); lot.qty-=t; need-=t; }
        s.lots=s.lots.filter(l=>l.qty>1e-9);
        if(need>1e-9) s.deficit+=need;
        s.outQty+=-q;
      }
      s.qty=r4(s.qty+q);
      s.txns.push({mv, ln, in:q>0?q:0, out:q<0?-q:0, bal:s.qty, avg:s.avg});
    }
  }
  for(const id in st){ const s=st[id]; s.avg=r4(s.avg); s.value=Math.max(s.qty,0)*s.avg; }
  return {st, mvs};
}
const stOf = id => dv().st[id] || {qty:0,avg:0,lots:[],txns:[],value:0};
function itemStatus(it){
  if(it.status==='inactive') return ['Inactive','c-rest','inactive'];
  const s=stOf(it.id);
  if(s.qty<0) return ['Negative','c-bad','neg'];
  if(s.qty<=0) return ['Out of stock','c-bad','out'];
  if(num(it.reorderLevel)>0 && s.qty<=num(it.reorderLevel)) return ['Low stock','c-opt','low'];
  return ['Healthy','c-ok','ok'];
}
function expiringLots(days){
  const out=[]; const items=all('items');
  for(const it of items){ for(const lot of stOf(it.id).lots){ if(!lot.exp) continue; const d=daysTo(lot.exp); if(d<=days) out.push({it,lot,d}); } }
  return out.sort((a,b)=>a.d-b.d);
}
const expBucket = d => d<0?['Expired','c-bad']:d<=30?['≤ 30 days','c-bad']:d<=60?['≤ 60 days','c-opt']:['≤ 90 days','c-warn'];

/* ---------- products (BOM) ---------- */
function productCost(p){ return r2((p.components||[]).reduce((s,c)=>s+stOf(c.itemId).avg*num(c.qty),0) + num(p.extraCost)); }
function productAvail(p){
  const comps=(p.components||[]).filter(c=>get('items',c.itemId) && num(c.qty)>0);
  if(!comps.length) return null;
  let n=Infinity, limit=null;
  for(const c of comps){ const k=Math.floor(Math.max(0,stOf(c.itemId).qty)/num(c.qty)+1e-9); if(k<n){ n=k; limit=get('items',c.itemId); } }
  return {n, limit};
}
const margin = (price,cost) => price>0 ? (price-cost)/price : null;
// A sale line is either a saved product ({productId}) or a custom package/item with its own recipe ({components}).
const lineComps = ln => Array.isArray(ln.components) ? ln.components : (get('products',ln.productId)?.components || []);
const compCost = comps => r2((comps||[]).reduce((s,c)=>s+stOf(c.itemId).avg*num(c.qty),0));
function lineCost(ln){ if(Array.isArray(ln.components)) return r2(compCost(ln.components)+num(ln.extraCost)); const p=get('products',ln.productId); return p?productCost(p):num(ln.unitCogs); }
function needsFor(lines){ // lines → {itemId: qty}
  const m={};
  for(const ln of lines){ for(const c of lineComps(ln)) if(c.itemId) m[c.itemId]=r4((m[c.itemId]||0)+num(c.qty)*num(ln.qty)); }
  return m;
}
function shortages(needs){
  const out=[]; for(const id in needs){ const it=get('items',id); const have=stOf(id).qty; if(needs[id]>have+1e-9) out.push({it, need:needs[id], have}); } return out;
}

/* ---------- orders ---------- */
const oSub = o => (o.items||[]).reduce((s,l)=>s+num(l.qty)*num(l.price),0);
const oTotal = o => r2(oSub(o) - num(o.discount) + num(o.shipping));
const oCogs = o => r2((o.items||[]).reduce((s,l)=>s+num(l.qty)*num(l.unitCogs),0));
const oPaid = o => r2((o.payments||[]).reduce((s,p)=>s+num(p.amount),0));
const oCounts = o => !o.voided && CONFIRMED.has(o.status) && o.paymentStatus!=='Refunded';
const oBal = o => oCounts(o) ? r2(oTotal(o)-oPaid(o)) : 0;
const oDeducted = o => !!o.deductMv && !o.reverseMv;
const custName = o => (o.customerId && get('customers',o.customerId)?.name) || o.customerName || 'Walk-in';
const oTitle = o => (o.items||[]).map(l=>(num(l.qty)!==1?qf(l.qty)+'× ':'')+l.name).join(', ') || 'Order';
function nextNo(col, prefix, start){
  let mx=start; for(const o of all(col)){ const n=parseInt(String(o.no||'').replace(/\D/g,''),10); if(n>mx) mx=n; } return prefix+(mx+1);
}
function payStatusFor(o){ const t=oTotal(o), p=oPaid(o); if(o.paymentStatus==='Refunded') return 'Refunded'; if(p<=0.004) return 'Unpaid'; if(p+0.004>=t) return 'Paid'; return 'Partially Paid'; }

/* ---------- purchases ---------- */
const puSub = p => (p.lines||[]).reduce((s,l)=>s+num(l.qty)*num(l.unitCost),0);
const puTotal = p => r2(puSub(p) + num(p.fees));
const supName = p => (p.supplierId && get('suppliers',p.supplierId)?.name) || p.supplierName || '—';

/* ---------- periods & finance ---------- */
const U = { view:'dashboard', period:'month', from:'', to:'', q:{}, f:{}, sub:{}, report:'pl' };
function rangeOf(key){
  const t=new Date(), y=t.getFullYear(), m=t.getMonth();
  switch(key){
    case 'today': return [today(),today(),'Today'];
    case 'week': { const dow=(t.getDay()+6)%7; const a=new Date(y,m,t.getDate()-dow); return [isoD(a), isoD(new Date(a.getFullYear(),a.getMonth(),a.getDate()+6)),'This week']; }
    case 'month': return [isoD(new Date(y,m,1)), isoD(new Date(y,m+1,0)), MON[m]+' '+y];
    case 'last': return [isoD(new Date(y,m-1,1)), isoD(new Date(y,m,0)), MON[(m+11)%12]+' '+(m===0?y-1:y)];
    case 'quarter': { const q=Math.floor(m/3); return [isoD(new Date(y,q*3,1)), isoD(new Date(y,q*3+3,0)), 'Q'+(q+1)+' '+y]; }
    case 'year': return [y+'-01-01', y+'-12-31', String(y)];
    case 'custom': return [U.from||'0000-01-01', U.to||'9999-12-31', (U.from?fd(U.from):'Start')+' – '+(U.to?fd(U.to):'today')];
    default: return ['0000-01-01','9999-12-31','All time'];
  }
}
const inR = (d,[a,b]) => d>=a && d<=b;
const LOSS_EXCLUDE = new Set(['Returned to supplier']);
function fin(range){
  const os=all('orders').filter(o=>oCounts(o) && inR(o.date,range));
  const revenue=os.reduce((s,o)=>s+oTotal(o),0), cogs=os.reduce((s,o)=>s+oCogs(o),0);
  const ex=all('expenses').filter(e=>!e.voided && inR(e.date,range));
  const opex=ex.filter(e=>e.category!=='Inventory purchases').reduce((s,e)=>s+num(e.amount),0);
  let losses=0;
  for(const mv of all('movements')) if(mv.type==='adjustment' && !LOSS_EXCLUDE.has(mv.reason) && inR(mv.date,range)) for(const ln of mv.lines||[]) losses += -num(ln.qty)*num(ln.unitCost);
  const gross=revenue-cogs, net=gross-opex-losses;
  // cash
  let cashIn=0;
  for(const o of all('orders')) if(!o.voided) for(const p of o.payments||[]) if(inR(p.date,range)) cashIn+=num(p.amount);
  const pus=all('purchases').filter(p=>!p.voided && inR(p.date,range));
  const supplierPaid=pus.reduce((s,p)=>s+num(p.paid),0);
  const shipping=ex.filter(e=>e.category==='Shipping').reduce((s,e)=>s+num(e.amount),0);
  const invExp=ex.filter(e=>e.category==='Inventory purchases').reduce((s,e)=>s+num(e.amount),0);
  const otherOpex=opex-shipping;
  const cashOut=supplierPaid+opex+invExp;
  return { revenue, cogs, gross, margin:margin(revenue,cogs), opex, losses, net, orders:os.length, aov:os.length?revenue/os.length:0,
    units:os.reduce((s,o)=>s+(o.items||[]).reduce((a,l)=>a+num(l.qty),0),0), cashIn, supplierPaid, shipping, otherOpex, invExp, cashOut, netCash:cashIn-cashOut, os, ex, pus };
}

const payable = () => all('purchases').filter(p=>!p.voided).reduce((s,p)=>s+Math.max(0,puTotal(p)-num(p.paid)),0);

  const t=new Date(), out=[];

}

function auditFor(id){ const out=[]; for(const d of all('audit')) for(const e of d.entries||[]) if(e.ref===id) out.push(e); return out.sort((a,b)=>a.t-b.t); }

async function deductOrder(o, date){
  const needs=needsFor(o.items);
  const lines=Object.keys(needs).map(itemId=>({itemId, qty:-needs[itemId], unitCost:stOf(itemId).avg}));
  // lock actual COGS per line from current average costs
  o.items=o.items.map(l=>({...l, unitCogs: lineCost(l)}));
  o.unitCogsFinal=true;
  const mv=mkMovement('sale', date||o.date, lines, {ref:{col:'orders',id:o.id}, refNo:o.no+' ('+oTitle(o)+')'});
  await put('movements', mv); o.deductMv=mv.id; o.reverseMv=null;
}
async function reverseOrder(o, type){
  const src=get('movements',o.deductMv); if(!src) return;
  const mv=mkMovement(type, today(), src.lines.map(l=>({itemId:l.itemId, qty:-num(l.qty), unitCost:num(l.unitCost)})), {ref:{col:'orders',id:o.id}, refNo:o.no});
  await put('movements', mv); o.reverseMv=mv.id;
}
async function saveOrderStatus(id){
  const o=clone(get('orders',id)); const s=$('#oStatus')?.value; if(!s){ closeModal(); return; }
  const prev=o.status;
  if(CONFIRMED.has(s) && !oDeducted(o) && !o.imported){
    const sh=shortages(needsFor(o.items));
    if(sh.length && !confirm('Insufficient Inventory\n\n'+sh.map(x=>`${x.it.name}: need ${qf(x.need)}, have ${qf(x.have)}`).join('\n')+'\n\nConfirm anyway? Stock will go negative.')) return;
    await deductOrder(o, today());
  }
  if((s==='Cancelled'||s==='Returned') && oDeducted(o)) await reverseOrder(o, s==='Returned'?'return':'cancel');
  o.status=s; await put('orders',o); await audit('status','orders',id,`Status ${prev} → ${s}`);
  closeModal(); render(); toast('Order '+o.no+' is now '+s);
}
function payModal(id){
  const o=get('orders',id), bal=oBal(o);
  openModal('Record payment · '+o.no, `<div class="fg"><label class="f">Amount<input type="number" step="any" inputmode="decimal" id="pyAmt" value="${bal}"></label><label class="f">Date<input type="date" id="pyDate" value="${today()}"></label>
  <label class="f full">Method<select id="pyMethod">${cfg().paymentMethods.map(m=>`<option ${m===o.paymentMethod?'selected':''}>${esc(m)}</option>`).join('')}</select></label></div><p class="hint">Balance due: ${money(bal)}</p>`,
  `<div class="rt"><button class="btn" data-act="openOrder" data-id="${id}">Back</button><button class="btn ok" data-act="savePay" data-id="${id}">Save payment</button></div>`, 'narrow');
}
async function savePay(id){
  const o=clone(get('orders',id)); const a=num($('#pyAmt').value); if(!(a>0)){ toast('Enter an amount.'); return; }
  o.payments=(o.payments||[]).concat({id:uid('pay_'),date:$('#pyDate').value||today(),amount:a,method:$('#pyMethod').value});
  o.paymentStatus=payStatusFor({...o,paymentStatus:''}); o.paymentMethod=$('#pyMethod').value;
  await put('orders',o); await audit('payment','orders',id,`Payment ${money(a)} via ${o.paymentMethod}`);
  orderView(id); render(); toast('Payment recorded');
}
async function refundOrder(id){
  const o=clone(get('orders',id)); const paid=oPaid(o);
  if(!confirm(`Refund ${money(paid)} to ${custName(o)}? The order will stop counting as revenue. To put items back into stock, also set its status to Returned.`)) return;
  o.payments=(o.payments||[]).concat({id:uid('pay_'),date:today(),amount:-paid,method:o.paymentMethod||'Other'});
  o.paymentStatus='Refunded'; await put('orders',o); await audit('refund','orders',id,`Refunded ${money(paid)}`);
  orderView(id); render(); toast('Refund recorded');
}
async function voidOrder(id){
  const o=clone(get('orders',id));
  const reason=prompt('Why are you voiding '+o.no+'? (e.g. duplicate entry, wrong customer)\n\nVoided orders stay in history but stop counting toward sales. Deducted stock goes back.');
  if(reason===null) return; if(!reason.trim()){ toast('A reason is required to void.'); return; }
  if(oDeducted(o)) await reverseOrder(o,'void');
  o.voided=true; o.voidedAt=Date.now(); o.voidReason=reason.trim(); o.voidedBy=S.uid||'local';
  await put('orders',o); await audit('void','orders',id,'Voided: '+reason.trim());
  closeModal(); render(); toast(o.no+' voided');
}

    mv.date=o.date; mv.refNo=o.no+' ('+oTitle(o)+')'; mv.editedAt=Date.now();
    await put('movements',mv);
  }
  const ch=[]; if(old.date!==o.date) ch.push(`date ${fd(old.date)} → ${fd(o.date)}`); if(custName(old)!==custName(o)) ch.push(`customer ${custName(old)} → ${custName(o)}`);
  if(oTitle(old)!==oTitle(o)) ch.push(`items ${oTitle(old)} → ${oTitle(o)}`); if(Math.abs(oTotal(old)-t)>0.004) ch.push(`total ${money(oTotal(old))} → ${money(t)}`);
  if(old.paymentStatus!==o.paymentStatus) ch.push(`payment ${old.paymentStatus} → ${o.paymentStatus}`); if((old.notes||'')!==(o.notes||'')) ch.push('notes changed');
  await put('orders',o);
  await audit('edit','orders',o.id,`Edited ${o.no}: ${ch.join('; ')||'no changes'}`);
  closeModal(); render(); toast(o.no+' updated'); setTimeout(()=>orderView(o.id),50);
}
</script>
<script>
/* =================== PRODUCTS & KITS =================== */
function vProducts(){
  const f=U.f.products||'active', q=qOf('products');
  let ps=all('products').sort((a,b)=>a.name.localeCompare(b.name));
  ps=ps.filter(p=>f==='all'?true:f==='inactive'?p.status==='inactive':p.status!=='inactive' && (f==='active'||p.type===f));
  if(q) ps=ps.filter(p=>(p.name+' '+(p.sku||'')+' '+p.type).toLowerCase().includes(q));
  const types=[...new Set(all('products').map(p=>p.type))];
  return ph('Products & Kits','What you sell. Each product has a recipe of inventory components, so its cost and availability update automatically.', isAdmin()?`<button class="btn primary" data-act="newProduct">${ic('plus')}Add product</button>`:lockNote('Only admins edit products')) + `
  <div class="tb">${searchBox('products','Search products')}</div>
  <div style="margin-bottom:14px">${chipsF('products',[['active','Active'],...types.map(t=>[t,t]),['inactive','Archived'],['all','All']],f)}</div>
  ${tableHTML([
    {h:'Product',v:p=>`<span class="nm">${esc(p.name)}</span><div class="sub">${esc(p.sku||'')}${p.sku?' · ':''}${esc(p.type)}</div>`},
    {h:'Selling price',num:1,v:p=>num(p.price)>0?money(p.price)+(num(p.resellerPrice)>0?`<div class="sub">Reseller ${money(p.resellerPrice)}</div>`:''):'<span class="chip c-warn">Not set</span>'},
    {h:'COGS',num:1,v:p=>money(productCost(p))},
    {h:'Gross profit',num:1,v:p=>{ const c=productCost(p); return num(p.price)>0?`<span class="${p.price<c?'neg':'pos'}">${money(p.price-c)}</span>`:'—'; }},
    {h:'Margin',num:1,v:p=>{ const m=margin(num(p.price),productCost(p)); return m===null?'—':`<span class="chip ${m<0?'c-bad':m<0.2?'c-opt':'c-ok'}">${pct(m)}</span>`; }},
    {h:'Available',num:1,v:p=>{ const a=productAvail(p); return a?`<b style="font-weight:600">${a.n}</b>${a.limit&&a.n<10?`<div class="sub">${esc(a.limit.name)}</div>`:''}`:'<span class="chip c-warn">No recipe</span>'; }},
    {h:'Status',v:p=>p.status==='inactive'?'<span class="chip c-rest">Archived</span>':'<span class="chip c-ok">Active</span>'},
  ], ps, {click:p=>`data-act="openProduct" data-id="${p.id}"`, empty:`<h3>No products</h3><p>Start with your T15 Set: add Tirz 15mg × 1, Bacwater 3ml × 1, and the packaging it uses.</p>${isAdmin()?`<button class="btn primary" data-act="newProduct">${ic('plus')}Add product</button>`:''}`})}`;
}
let PE=null;
function productModal(id, copyOf){
  const src=id?get('products',id):copyOf?get('products',copyOf):null;
  PE=src?clone(src):{name:'',sku:'',type:'Set / Kit',description:'',price:'',resellerPrice:'',extraCost:'',components:[],status:'active'};
  if(copyOf){ PE.name+=' (copy)'; PE.sku=''; }
  PE._id=id||null;
  const ro=!isAdmin();
  const sold=id?all('orders').some(o=>o.items.some(l=>l.productId===id)):false;
  const body=`${ro?`<div class="banner info">${ic('lock')} You can view products. Only admins can change prices and recipes.</div>`:''}
  <fieldset ${ro?'disabled':''}><div class="fg">
    <label class="f full">Product name <em>*</em><input type="text" id="peName" value="${esc(PE.name)}" placeholder="e.g. T15 Set"></label>
    <label class="f">SKU<input type="text" id="peSku" value="${esc(PE.sku)}" placeholder="T15-SET"></label>
    <label class="f">Product type<select id="peType">${PROD_TYPES.map(t=>`<option ${t===PE.type?'selected':''}>${t}</option>`).join('')}</select></label>
    <label class="f">Status<select id="peStatus"><option value="active" ${PE.status!=='inactive'?'selected':''}>Active</option><option value="inactive" ${PE.status==='inactive'?'selected':''}>Archived</option></select></label>
    <label class="f full">Description<input type="text" id="peDesc" value="${esc(PE.description)}" placeholder="What’s included, who it’s for"></label>
  </div></fieldset>
  <fieldset ${ro?'disabled':''}><legend>Price</legend><div class="fg">
    <label class="f">Selling price<input type="number" step="any" inputmode="decimal" id="pePrice" value="${PE.price}"></label>
    <label class="f">Reseller price (optional)<input type="number" step="any" inputmode="decimal" id="peRes" value="${PE.resellerPrice}"></label>
    <label class="f">Extra cost per unit<input type="number" step="any" inputmode="decimal" id="peExtra" value="${PE.extraCost}" placeholder="e.g. admin fee 20"></label>
  </div><p class="hint">Extra cost is for per-unit costs that aren’t inventory, like an admin fee. It’s added to COGS.</p></fieldset>
  <fieldset ${ro?'disabled':''}><legend>Recipe (components)</legend>
    <p class="small muted" style="margin-bottom:10px">Selling 1 of this product deducts these items. Use decimals for shared items, like 0.1 of a tape roll.</p>
    <div class="lines" id="peComps"></div>
    ${ro?'':`<button type="button" class="btn sm" data-act="peAdd">${ic('plus')}Add component</button>`}
  </fieldset>
  <div class="preview" id="peSum"></div>`;
  const foot=ro?`<div class="rt"><button class="btn" data-act="close">Close</button></div>`:`${id?`<button class="btn" data-act="copyProduct" data-id="${id}">${ic('copy')}Duplicate</button>`:''}<div class="rt"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="saveProduct">${id?'Save changes':'Add product'}</button></div>`;
  openModal(id?PE.name:'Add product', body, foot, '', id?(sold?'Has sales history — archive instead of deleting':''):'');
  peComps(); peSum();
  const mb=$('#mbody'); mb.addEventListener('input',peInput); mb.addEventListener('change',peInput);
}
function itemOptions(sel, withNew){
  const items=all('items').filter(i=>i.status!=='inactive'||i.id===sel).sort((a,b)=>a.name.localeCompare(b.name));
  return (withNew?`<option value="__new" ${sel==='__new'?'selected':''}>＋ New inventory item…</option>`:'')+ITEM_TYPES.map(t=>{ const g=items.filter(i=>i.type===t); return g.length?`<optgroup label="${t}">${g.map(i=>`<option value="${i.id}" ${i.id===sel?'selected':''}>${esc(i.name)} (${qf(stOf(i.id).qty)} ${esc(i.unit||'')})</option>`).join('')}</optgroup>`:''; }).join('');
}
function peComps(){
  const ro=!isAdmin();
  $('#peComps').innerHTML=PE.components.length?PE.components.map((c,i)=>{ const s=stOf(c.itemId); return `<div class="ln ln-comp" data-i="${i}">
    <label class="f sel">Inventory item<select data-f="itemId" ${ro?'disabled':''}>${itemOptions(c.itemId)}</select></label>
    <label class="f">Qty<input type="number" step="any" inputmode="decimal" data-f="qty" value="${c.qty}" ${ro?'disabled':''}></label>
    <label class="f">Unit cost<input type="text" readonly tabindex="-1" value="${money(s.avg)}"></label>
    <label class="f">Line cost<input type="text" readonly tabindex="-1" data-lc value="${money(s.avg*num(c.qty))}"></label>
    ${ro?'<span></span>':`<button type="button" class="icon-btn" data-act="peDel" data-i="${i}" aria-label="Remove component">${ic('x')}</button>`}</div>`; }).join(''):`<div class="warnbox">No components yet. Without a recipe, selling this product won’t deduct inventory.</div>`;
}
function peSum(){
  const c=productCost(PE), pr=num(PE.price), rs=num(PE.resellerPrice), a=productAvail(PE);
  const row=(l,p)=>p>0?`<dt>${l}</dt><dd class="${p<c?'neg':''}">${money(p-c)} profit · ${pct(margin(p,c))}</dd>`:'';
  $('#peSum').innerHTML=`<dl class="kv"><dt>COGS (auto)</dt><dd style="font-size:18px;font-weight:600">${money(c)}</dd>${row('At selling price',pr)}${row('At reseller price',rs)}
  <dt>Available to sell</dt><dd>${a?a.n+(a.limit?' — limited by '+esc(a.limit.name):''):'—'}</dd></dl>
  ${pr>0&&pr<c?`<div class="warnbox bad"><b>Selling price is lower than COGS.</b></div>`:''}${rs>0&&rs<c?`<div class="warnbox bad"><b>Reseller price is lower than COGS.</b></div>`:''}
  ${c>0?`<p class="hint">For a 40% margin, price at ${money(Math.ceil(c/0.6/10)*10)} or more.</p>`:''}`;
}
function peInput(e){
  const t=e.target, ln=t.closest('.ln');
  if(ln){ const i=+ln.dataset.i; if(t.dataset.f==='itemId'){ PE.components[i].itemId=t.value; peComps(); } if(t.dataset.f==='qty'){ PE.components[i].qty=num(t.value); const lc=ln.querySelector('[data-lc]'); if(lc) lc.value=money(stOf(PE.components[i].itemId).avg*num(t.value)); } }
  if(t.id==='pePrice') PE.price=num(t.value); if(t.id==='peRes') PE.resellerPrice=num(t.value); if(t.id==='peExtra') PE.extraCost=num(t.value);
  peSum();
}
async function saveProduct(){
  const name=$('#peName').value.trim(); if(!name){ toast('Add a product name.'); return; }
  const comps=PE.components.filter(c=>get('items',c.itemId)&&num(c.qty)>0);
  const d={name, sku:$('#peSku').value.trim(), type:$('#peType').value, status:$('#peStatus').value, description:$('#peDesc').value.trim(),
    price:num($('#pePrice').value), resellerPrice:num($('#peRes').value), extraCost:num($('#peExtra').value), components:comps};
  if(!comps.length && !confirm('This product has no components, so selling it won’t deduct any inventory. Save anyway?')) return;
  const c=productCost(d); if(d.price>0 && d.price<c && !confirm(`Selling price ${money(d.price)} is below COGS ${money(c)}. Save anyway?`)) return;
  if(PE._id){ const old=get('products',PE._id); await put('products',{...old,...d}); await audit('update','products',PE._id,`Updated product ${name}`+(old.price!==d.price?` (price ${money(old.price)} → ${money(d.price)})`:'')); }
  else { const p={id:uid('p_'),...d,created:Date.now()}; await put('products',p); await audit('create','products',p.id,'Added product '+name); }
  closeModal(); render(); toast('Product saved');
}

/* =================== INVENTORY =================== */
function vInventory(){
  const tab=U.sub.inventory||'items';
  const tabs=`<div class="seg" style="margin-bottom:14px">${[['items','Items'],['ledger','Ledger'],['expiring','Expiry']].map(([k,l])=>`<button data-act="sub" data-k="inventory" data-v="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>`;
  const acts=`${isAdmin()?`<button class="btn" data-act="importData">${ic('dl')}Import</button>`:''}${canAdjust()?`<button class="btn" data-act="count">${ic('clip')}Stock count</button><button class="btn" data-act="newAdjust">${ic('sliders')}Adjustment</button>`:''}${isAdmin()?`<button class="btn primary" data-act="newItem">${ic('plus')}Add item</button>`:''}`;
  let body='';
  if(tab==='items'){
    const f=U.f.inventory||'all', q=qOf('inventory');
    let items=all('items').sort((a,b)=>ITEM_TYPES.indexOf(a.type)-ITEM_TYPES.indexOf(b.type)||a.name.localeCompare(b.name));
    const exIds=new Set(expiringLots(num(cfg().expiryWarnDays)||90).map(e=>e.it.id));
    const F={all:i=>i.status!=='inactive', low:i=>itemStatus(i)[2]==='low', out:i=>['out','neg'].includes(itemStatus(i)[2]), ok:i=>itemStatus(i)[2]==='ok', expiring:i=>exIds.has(i.id), inactive:i=>i.status==='inactive'};
    for(const t of ITEM_TYPES) F[t]=i=>i.type===t && i.status!=='inactive';
    const n=k=>items.filter(F[k]).length;
    items=items.filter(F[f]||F.all);
    if(q) items=items.filter(i=>(i.name+' '+(i.sku||'')+' '+i.type+' '+(i.category||'')).toLowerCase().includes(q));
    const val=items.reduce((s,i)=>s+stOf(i.id).value,0);
    body=`<div class="tb">${searchBox('inventory','Search inventory')}</div>
    <div style="margin-bottom:14px">${chipsF('inventory',[['all','All'],['out','Out of stock',n('out')],['low','Low stock',n('low')],['ok','Healthy'],['expiring','Expiring',n('expiring')],...ITEM_TYPES.filter(t=>n(t)).map(t=>[t,t]),['inactive','Inactive']],f)}</div>
    ${tableHTML([
      {h:'Item',v:i=>`<span class="nm">${esc(i.name)}</span><div class="sub">${esc(i.sku||'')}${i.sku?' · ':''}${esc(i.type)}</div>`},
      {h:'On hand',num:1,v:i=>`<b style="font-weight:600" class="${stOf(i.id).qty<0?'neg':''}">${qf(stOf(i.id).qty)}</b> <span class="muted small">${esc(i.unit||'')}</span>`},
      {h:'Avg cost',num:1,v:i=>stOf(i.id).avg>0?money(stOf(i.id).avg):'<span class="chip c-warn">None</span>'},
      {h:'Value',num:1,v:i=>money(stOf(i.id).value)},
      {h:'Reorder at',num:1,v:i=>num(i.reorderLevel)?qf(i.reorderLevel):'—'},
      {h:'Status',v:i=>{ const [l,c]=itemStatus(i); return `<span class="chip ${c}"><i></i>${l}</span>`+(exIds.has(i.id)?' <span class="chip c-bad">Expiring</span>':''); }},
    ], items, {click:i=>`data-act="openItem" data-id="${i.id}"`, foot:items.length?['Total','','','',money(val),'']:null,
      empty:`<h3>No items here</h3><p>Inventory items are the components you stock: peptides, bac water, syringes, packaging.</p>${isAdmin()?`<button class="btn primary" data-act="newItem">${ic('plus')}Add item</button>`:''}`})}`;
  }
  if(tab==='ledger'){
    const fi=U.f.ledgerItem||'', ft=U.f.ledgerType||'';
    const rows=[];
    for(const it of all('items')){ if(fi && it.id!==fi) continue; for(const t of stOf(it.id).txns){ if(ft && t.mv.type!==ft) continue; rows.push({it,t}); } }
    rows.sort((a,b)=>mvSort(b.t.mv,a.t.mv) || (b.t.bal-a.t.bal));
    body=`<div class="hlp">Every change to stock is a transaction here. Quantities are calculated from these entries only — purchases add, sales and adjustments subtract.</div>
    <div class="tb"><label class="f" style="min-width:220px;flex:1">Item<select id="ledItem"><option value="">All items</option>${itemOptions(fi)}</select></label>
    <label class="f" style="min-width:180px">Transaction<select id="ledType"><option value="">All types</option>${Object.entries(MV_LABEL).map(([k,l])=>`<option value="${k}" ${ft===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${tableHTML([
      {h:'Date',v:x=>fd(x.t.mv.date)},{h:'Item',v:x=>esc(x.it.name)},{h:'Transaction',cls:'wrapc',v:x=>esc(mvLabel(x.t.mv))},
      {h:'Qty in',num:1,v:x=>x.t.in?`<span class="pos">+${qf(x.t.in)}</span>`:''},{h:'Qty out',num:1,v:x=>x.t.out?`<span class="neg">−${qf(x.t.out)}</span>`:''},
      {h:'Balance',num:1,v:x=>`<b style="font-weight:600">${qf(x.t.bal)}</b>`},{h:'Unit cost',num:1,v:x=>x.t.ln.unitCost!=null?money(x.t.ln.unitCost):'—'},
    ], rows.slice(0,500), {click:x=>`data-act="openMv" data-id="${x.t.mv.id}"`, empty:'<h3>No transactions yet</h3><p>Record a purchase or add an item with an opening balance.</p>'})}
    ${rows.length>500?'<p class="hint">Showing the latest 500. Filter by item to see more.</p>':''}`;
  }
  if(tab==='expiring'){
    const lots=expiringLots(100000).filter(e=>e.d<=90);
    const allLots=[]; for(const it of all('items')) for(const lot of stOf(it.id).lots) allLots.push({it,lot});
    const noExp=allLots.filter(x=>!x.lot.exp && ['Peptide','Bacwater'].includes(x.it.type));
    const b=k=>lots.filter(e=>k==='x'?e.d<0:k==='30'?e.d>=0&&e.d<=30:k==='60'?e.d>30&&e.d<=60:e.d>60).length;
    body=`<div class="kpis" style="margin-bottom:14px"><div class="kpi"><span>Expired</span><b class="neg">${b('x')}</b></div><div class="kpi"><span>Within 30 days</span><b>${b('30')}</b></div><div class="kpi"><span>31–60 days</span><b>${b('60')}</b></div><div class="kpi"><span>61–90 days</span><b>${b('90')}</b></div></div>
    ${tableHTML([{h:'Item',v:e=>`<span class="nm">${esc(e.it.name)}</span>`},{h:'Batch / lot',v:e=>esc(e.lot.lot||'—')},{h:'Expires',v:e=>fd(e.lot.exp)},{h:'When',v:e=>{ const [l,c]=expBucket(e.d); return `<span class="chip ${c}">${l}</span> <span class="small muted">${e.d<0?Math.abs(e.d)+' days ago':e.d+' days'}</span>`; }},{h:'Remaining',num:1,v:e=>qf(e.lot.qty)},{h:'Supplier',v:e=>esc(get('suppliers',e.lot.supplierId)?.name||'—')}],
      lots, {click:e=>`data-act="openItem" data-id="${e.it.id}"`, empty:'<h3>Nothing expiring in the next 90 days</h3><p>Expiry is tracked per batch. Add the lot number and expiry date when you record a purchase.</p>'})}
    ${noExp.length?`<p class="hint" style="margin-top:10px">${noExp.length} batch${noExp.length>1?'es':''} of peptides or bac water have no expiry date (e.g. ${esc(noExp.slice(0,3).map(x=>x.it.name).join(', '))}). Add one from the item page to track it.</p>`:''}
    ${lots.some(e=>e.d<0)&&canAdjust()?`<p class="hint">Write off expired stock with an <a href="#" data-act="newAdjust">adjustment</a> using the reason “Expired”.</p>`:''}`;
  }
  return ph('Inventory','The components you stock. Quantity comes from the ledger, never typed in directly.', acts) + tabs + body;
}
function itemView(id){
  const it=get('items',id); if(!it) return; const s=stOf(id); const [sl,sc]=itemStatus(it);
  const used=all('products').filter(p=>(p.components||[]).some(c=>c.itemId===id));
  const sup=get('suppliers',it.supplierId);
  const body=`<div class="row wr" style="gap:6px;margin-bottom:12px"><span class="chip ${sc}"><i></i>${sl}</span><span class="chip c-rest">${esc(it.type)}</span>${it.category?`<span class="chip c-rest">${esc(it.category)}</span>`:''}${it.sku?`<span class="chip c-rest">SKU ${esc(it.sku)}</span>`:''}</div>
  <div class="mini" style="margin-bottom:14px"><div><span>On hand</span><b class="${s.qty<0?'neg':''}">${qf(s.qty)} ${esc(it.unit||'')}</b></div><div><span>Avg cost</span><b>${money(s.avg)}</b></div><div><span>Value</span><b>${money(s.value)}</b></div><div><span>Reorder at / qty</span><b>${num(it.reorderLevel)?qf(it.reorderLevel):'—'} / ${num(it.reorderQty)?qf(it.reorderQty):'—'}</b></div></div>
  <dl class="kv"><dt>Selling price</dt><dd>${num(it.sellPrice)>0?money(it.sellPrice):'—'}</dd><dt>Main supplier</dt><dd>${esc(sup?.name||'—')}</dd>
  <dt>Last purchased</dt><dd>${s.lastIn?fd(s.lastIn.date)+' · '+qf(s.lastIn.qty)+' @ '+money(s.lastIn.unitCost):'—'}</dd>
  <dt>Used in</dt><dd>${used.length?used.map(p=>esc(p.name)).join(', '):'No products'}</dd>${it.notes?`<dt>Notes</dt><dd>${esc(it.notes)}</dd>`:''}</dl>
  ${s.lots.length?`<h3 style="font-size:15px;margin:16px 0 8px">Batches on hand</h3>${tableHTML([{h:'Lot',v:l=>esc(l.lot||'—')},{h:'Expires',v:l=>l.exp?fd(l.exp)+' '+(daysTo(l.exp)<=90?`<span class="chip ${expBucket(daysTo(l.exp))[1]}">${expBucket(daysTo(l.exp))[0]}</span>`:''):'—'},{h:'Remaining',num:1,v:l=>qf(l.qty)},{h:'Received',v:l=>fd(l.date)},{h:'Supplier',v:l=>esc(get('suppliers',l.supplierId)?.name||'—')}],s.lots)}`:''}
  <h3 style="font-size:15px;margin:16px 0 8px">Transaction history</h3>
  ${tableHTML([{h:'Date',v:t=>fd(t.mv.date)},{h:'Transaction',cls:'wrapc',v:t=>esc(mvLabel(t.mv))},{h:'In',num:1,v:t=>t.in?'+'+qf(t.in):''},{h:'Out',num:1,v:t=>t.out?'−'+qf(t.out):''},{h:'Balance',num:1,v:t=>`<b style="font-weight:600">${qf(t.bal)}</b>`}],
    [...s.txns].reverse(), {click:t=>`data-act="openMv" data-id="${t.mv.id}"`, empty:'<p>No transactions yet.</p>'})}`;
  const foot=`${isAdmin()?`<button class="btn" data-act="editItem" data-id="${id}">Edit details</button>`:''}<div class="rt">${canAdjust()?`<button class="btn dark" data-act="newAdjust" data-id="${id}">${ic('sliders')}Adjust stock</button>`:lockNote('Adjustments need admin permission')}${isAdmin()?`<button class="btn primary" data-act="newPurchase" data-id="${id}">${ic('truck')}Restock</button>`:''}</div>`;
  openModal(it.name, body, foot, 'wide');
}
function itemForm(id){
  const it=id?get('items',id):{name:'',sku:'',type:'Peptide',category:'',unit:'vial',defaultCost:'',sellPrice:'',supplierId:'',reorderLevel:'',reorderQty:'',status:'active',notes:''};
  const c=cfg();
  const body=`<fieldset><div class="fg">
    <label class="f full">Item name <em>*</em><input type="text" id="itName" value="${esc(it.name)}" placeholder="e.g. Tirz 15mg"></label>

async function savePurchase(){
  const lines=PU.lines.filter(l=>num(l.qty)>0 && (l.itemId!=='__new'||l.nName.trim()));
  if(!lines.length){ toast('Add at least one item with a quantity.'); return; }
  const ed=PU.editId?get('purchases',PU.editId):null;
  if(ed && ed.movementId && !ed.imported){ // would this edit make any stock negative?
    const was={}, now={}; for(const l of get('movements',ed.movementId)?.lines||[]) was[l.itemId]=(was[l.itemId]||0)+num(l.qty);
    for(const l of lines) if(l.itemId!=='__new') now[l.itemId]=(now[l.itemId]||0)+num(l.qty);
    const neg=[...new Set([...Object.keys(was),...Object.keys(now)])].filter(id=>stOf(id).qty-(was[id]||0)+(now[id]||0)<-1e-9);
    if(neg.length && !confirm('Some of this stock was already sold. This change will make these negative: '+neg.map(id=>get('items',id)?.name).join(', ')+'. Save anyway?')) return;
  }
  if(lines.some(l=>!(num(l.unitCost)>0)) && !confirm('Some lines have no unit cost. Their COGS will be zero. Save anyway?')) return;
  let supplierId=$('#puSup').value;
  if(supplierId==='__new'){ const n=$('#puNewSup').value.trim(); if(!n){ toast('Enter the new supplier’s name.'); return; } const s={id:uid('s_'),name:n,contactPerson:'',contact:'',notes:'',created:Date.now()}; await put('suppliers',s); await audit('create','suppliers',s.id,'Added supplier '+n); supplierId=s.id; }
  const out=[];
  for(const l of lines){
    let id=l.itemId;
    if(id==='__new' && ed && ed.imported){ out.push({itemId:'', name:l.nName.trim(), qty:num(l.qty), unitCost:num(l.unitCost), lot:(l.lot||'').trim(), exp:l.exp||'', note:l.note||''}); continue; }
    if(id==='__new'){ const it={id:uid('i_'),name:l.nName.trim(),sku:'',type:l.nType,category:'',unit:l.nUnit,defaultCost:num(l.unitCost),sellPrice:0,supplierId,reorderLevel:0,reorderQty:0,status:'active',notes:'',created:Date.now()}; await put('items',it); await audit('create','items',it.id,'Added item '+it.name+' from a purchase'); id=it.id; }
    out.push({itemId:id, name:get('items',id).name, qty:num(l.qty), unitCost:num(l.unitCost), lot:(l.lot||'').trim(), exp:l.exp||'', ...(l.note?{note:l.note}:{})});
  }
  const fees=num($('#puFees').value), sub=out.reduce((s,l)=>s+l.qty*l.unitCost,0), alloc=$('#puAlloc').checked;
  const landed=l=>({itemId:l.itemId, qty:l.qty, unitCost:r4(l.unitCost+(alloc&&sub>0?fees*(l.qty*l.unitCost)/sub/l.qty:0)), lot:l.lot, exp:l.exp});
  if(ed){
    const p={...clone(ed), date:$('#puDate').value||ed.date, supplierId, supplierName:supplierId?'':(ed.supplierName||''), lines:out, fees, allocFees:alloc,
      paymentStatus:$('#puPay').value, paymentMethod:$('#puMethod').value, notes:$('#puNotes').value.trim(), editedAt:Date.now()};
    const tot=puTotal(p); p.paid = p.paymentStatus==='Paid'?tot:p.paymentStatus==='Partially Paid'?Math.min(num($('#puPaid').value),tot):0;
    if(ed.movementId && !ed.imported){ const mv=clone(get('movements',ed.movementId)); Object.assign(mv,{date:p.date, supplierId, refNo:p.no, lines:out.filter(l=>l.itemId).map(landed), editedAt:Date.now()}); await put('movements',mv); }
    await put('purchases',p);
    const ch=[]; if(ed.date!==p.date) ch.push(`date ${fd(ed.date)} → ${fd(p.date)}`); if(supName(ed)!==supName(p)) ch.push(`supplier ${supName(ed)} → ${supName(p)}`);
    const li=x=>x.lines.map(l=>qf(l.qty)+'× '+(get('items',l.itemId)?.name||l.name)+' @'+money(l.unitCost)).join(', ');
    if(li(ed)!==li(p)) ch.push(`items ${li(ed)} → ${li(p)}`); if(Math.abs(puTotal(ed)-tot)>0.004) ch.push(`total ${money(puTotal(ed))} → ${money(tot)}`); if(ed.paymentStatus!==p.paymentStatus) ch.push(`payment ${ed.paymentStatus} → ${p.paymentStatus}`);
    await audit('edit','purchases',p.id,`Edited ${p.no}: ${ch.join('; ')||'no changes'}`);
    render(); purchaseView(p.id); toast(p.no+' updated'+(ed.imported?'':' · stock recalculated')); return;
  }
  const p={id:uid('pu_'), no:nextNo('purchases','PO-',1000), date:$('#puDate').value||today(), supplierId, supplierName:'', lines:out, fees, allocFees:alloc,
    paymentStatus:$('#puPay').value, paymentMethod:$('#puMethod').value, notes:$('#puNotes').value.trim(), created:Date.now(), by:S.uid||'local'};
  const tot=puTotal(p); p.paid = p.paymentStatus==='Paid'?tot:p.paymentStatus==='Partially Paid'?Math.min(num($('#puPaid').value),tot):0;
  const mv=mkMovement('purchase', p.date, out.map(landed), {ref:{col:'purchases',id:p.id}, refNo:p.no, supplierId});
  await put('movements',mv); p.movementId=mv.id; await put('purchases',p);
  for(const l of out){ const it=get('items',l.itemId); if(supplierId && !it.supplierId) await put('items',{...it,supplierId}); }
  await audit('create','purchases',p.id,`Recorded ${p.no}: ${out.map(l=>qf(l.qty)+'× '+l.name).join(', ')} · ${money(tot)}`);
  closeModal(); render(); toast(p.no+' saved · inventory increased');
}
function purchaseView(id){

async function voidPurchase(id){
  const p=clone(get('purchases',id));
  const reason=prompt('Why are you voiding '+p.no+'?\n\nIt stays in history but stops counting, and its quantities are removed from stock.'); if(reason===null) return; if(!reason.trim()){ toast('A reason is required.'); return; }
  if(p.movementId && !p.imported){ const src=get('movements',p.movementId); if(src){ const neg=src.lines.filter(l=>stOf(l.itemId).qty-l.qty<0); if(neg.length && !confirm('Some of this stock was already used. Voiding will make these negative: '+neg.map(l=>get('items',l.itemId)?.name).join(', ')+'. Continue?')) return;
    await put('movements', mkMovement('void', today(), src.lines.map(l=>({itemId:l.itemId, qty:-l.qty, unitCost:l.unitCost})), {ref:{col:'purchases',id}, refNo:p.no})); } }
  p.voided=true; p.voidedAt=Date.now(); p.voidReason=reason.trim(); await put('purchases',p); await audit('void','purchases',id,'Voided: '+reason.trim());
  closeModal(); render(); toast(p.no+' voided');
}

function vExpenses(){

  const byCat={}; for(const e of all('expenses').filter(e=>!e.voided&&inR(e.date,r))) byCat[e.category]=(byCat[e.category]||0)+num(e.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...cats.map(c=>c[1]));

  ${tableHTML([{h:'Date',v:e=>fd(e.date)},{h:'Description',cls:'wrapc',v:e=>`<span class="nm">${esc(e.description)}</span>${e.vendor?`<div class="sub">${esc(e.vendor)}</div>`:''}`},{h:'Category',v:e=>`<span class="chip ${e.category==='Inventory purchases'?'c-warn':'c-rest'}">${esc(e.category)}</span>`},{h:'Method',v:e=>esc(e.method||'—')},{h:'Amount',num:1,v:e=>money(e.amount)+(e.receiptId?' 📎':'')}],
    ex, {click:e=>`data-act="openExpense" data-id="${e.id}"`, rowCls:e=>e.voided?'void':'', foot:ex.length?['','','','Total',money(ex.filter(e=>!e.voided).reduce((s,e)=>s+num(e.amount),0))]:null, empty:'<h3>No expenses in this period</h3><p>Add shipping, courier, ads, payment fees and other running costs.</p>'})}
  </div><div><div class="card"><div class="card-h"><h3>By category · ${esc(r[2])}</h3></div>

  ${byCat['Inventory purchases']?`<p class="hint">“Inventory purchases” recorded here are left out of operating expenses to avoid double counting. Use Purchases so they also add stock.</p>`:''}</div></div></div>`;

async function saveExpense(id){

  return {ps, items:[...items].map(i=>get('items',i)).filter(Boolean), total:ps.reduce((s,p)=>s+puTotal(p),0), owed:ps.reduce((s,p)=>s+Math.max(0,puTotal(p)-num(p.paid)),0), last:ps.map(p=>p.date).sort().pop()};
}

const REPORTS=[['pl','Profit & Loss'],['cash','Cash flow'],['sales','Sales'],['prod','Product profitability'],['inv','Inventory'],['exp','Expenses'],['pur','Purchases']];
function reportData(key){
  const r=rangeOf(U.period), f=fin(r);
  if(key==='pl'){
    const rows=[['Revenue',f.revenue],['Cost of goods sold',-f.cogs],['Gross profit',f.gross],['Gross margin %',f.margin===null?'':r2(f.margin*100)],['Operating expenses',-f.opex],['Inventory losses',-f.losses],['Net profit',f.net]];
    return {title:'Profit & Loss · '+r[2], head:['Line','Amount'], rows, f, r};
  }
  if(key==='cash'){
    const rows=[['Customer payments (money in)',f.cashIn],['Supplier payments',-f.supplierPaid],['Operating expenses',-f.otherOpex],['Shipping',-f.shipping],['Other payments (inventory via expenses)',-f.invExp],['Net cash flow',f.netCash]];
    return {title:'Cash flow · '+r[2], head:['Line','Amount'], rows, f, r};
  }
  if(key==='sales'){
    const rows=[]; for(const o of f.os.sort((a,b)=>a.date.localeCompare(b.date))) for(const l of o.items) rows.push([o.date,o.no,custName(o),l.name,l.qty,l.price,r2(l.qty*l.price),r2(l.qty*l.unitCogs)]);
    return {title:'Sales · '+r[2], head:['Date','Order','Customer','Product','Qty','Price','Revenue','COGS'], rows, numCols:[4,5,6,7], totals:{4:1,6:1,7:1}, f, r};
  }
  if(key==='prod'){
    const m={}; for(const o of f.os) for(const l of o.items){ const k=l.name; m[k]=m[k]||{u:0,rev:0,cogs:0}; m[k].u+=num(l.qty); m[k].rev+=num(l.qty)*num(l.price); m[k].cogs+=num(l.qty)*num(l.unitCogs); }
    const rows=Object.entries(m).map(([k,v])=>[k,v.u,r2(v.rev),r2(v.cogs),r2(v.rev-v.cogs),v.rev?r2((v.rev-v.cogs)/v.rev*100):'']).sort((a,b)=>b[4]-a[4]);
    return {title:'Product profitability · '+r[2], head:['Product','Units sold','Revenue','COGS','Gross profit','Margin %'], rows, numCols:[1,2,3,4,5], totals:{1:1,2:1,3:1,4:1}, f, r};
  }
  if(key==='inv'){
    const rows=all('items').filter(i=>i.status!=='inactive').sort((a,b)=>a.name.localeCompare(b.name)).map(i=>{ const s=stOf(i.id); return [i.name,i.type,i.sku||'',s.qty,i.unit||'',s.avg,r2(s.value),itemStatus(i)[0]]; });
    return {title:'Inventory valuation (now)', head:['Item','Type','SKU','Quantity','Unit','Unit cost','Inventory value','Status'], rows, numCols:[3,5,6], totals:{6:1}, f, r};
  }
  if(key==='exp'){
    const rows=f.ex.filter(e=>!e.voided).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.category,e.description,e.vendor||'',e.method||'',num(e.amount)]);
    return {title:'Expenses · '+r[2], head:['Date','Category','Description','Vendor','Method','Amount'], rows, numCols:[5], totals:{5:1}, f, r};
  }
  if(key==='pur'){
    const rows=[]; for(const p of f.pus.sort((a,b)=>a.date.localeCompare(b.date))) for(const l of p.lines) rows.push([p.date,p.no,supName(p),get('items',l.itemId)?.name||l.name,l.lot||'',l.qty,l.unitCost,r2(l.qty*l.unitCost)]);
    return {title:'Purchases · '+r[2], head:['Date','PO','Supplier','Item','Lot','Qty','Unit cost','Cost'], rows, numCols:[5,6,7], totals:{5:1,7:1}, f, r};
  }
}

  } else {

    if(totals) totals[0]='Total';

  }
  return ph('Reports','Pick a report and a period. Export any of them to CSV or Excel.', `<button class="btn" data-act="exportReport" data-fmt="csv">${ic('dl')}CSV</button><button class="btn" data-act="exportReport" data-fmt="xlsx">${ic('dl')}Excel</button>`) + `
  <div class="chips" style="margin-bottom:12px">${REPORTS.map(([kk,l])=>`<button data-act="report" data-v="${kk}" aria-pressed="${k===kk}">${l}</button>`).join('')}</div>
  ${k!=='inv'?periodBar():''}${body}`;
}
async function exportReport(fmt){
  const d=reportData(U.report); const name=(d.title.replace(/[^\w]+/g,'-')+'-'+today()).toLowerCase();
  if(fmt==='csv'){ const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"'; return offerFile(name+'.csv', [d.head,...d.rows].map(r=>r.map(q).join(',')).join('\n')); }
  try{ await loadXLSX(); const ws=XLSX.utils.aoa_to_sheet([[d.title],[],d.head,...d.rows]); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Report'); const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'}); await offerFile(name+'.xlsx', buf); }
  catch(e){ toast('Excel export isn’t available here. Use CSV — Excel opens it too.'); }
}
function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function offerFile(filename, data){
  try{
    const dl=window.claude?.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename, data}); return; }
    const blob=new Blob([data]);
    try{ const file=new File([blob], filename); if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; } }catch(e){ if(e?.name==='AbortError') return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }catch(e){ if(e?.code==='extension_not_enabled') toast('That file type isn’t available here. Use CSV.'); else if(e?.code!=='declined') toast('Couldn’t save the file.'); }
}

<script>
/* =================== EXCEL / CSV IMPORT =================== */
const nh = h => String(h??'').toLowerCase().replace(/[^a-z0-9]/g,'');
const IMP = {
  inventory:{label:'Inventory', order:3, f:{
